<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-status-bar-style" content="default"/>
<meta name="apple-mobile-web-app-title" content="Consulta"/>
<meta name="theme-color" content="#f5f7fa" id="theme-color-meta"/>
<title>Consulta Privada</title>
<link rel="apple-touch-icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%231b3f6e'/><text y='.92em' font-size='72' x='10' fill='white'>ψ</text></svg>"/>
<!-- Geist via fontsource (Google Fonts does NOT host Geist) -->
<link href="https://cdn.jsdelivr.net/npm/@fontsource/geist@5/index.css" rel="stylesheet"/>
<link href="https://cdn.jsdelivr.net/npm/@fontsource/geist-mono@5/index.css" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&display=swap" rel="stylesheet"/>
<style>

  :root{
    /* Navy palette — deep marine + paper */
    --bg:        oklch(0.975 0.012 255);
    --paper:     oklch(0.995 0.008 255);
    --ink:       oklch(0.20  0.06  260);
    --ink-2:     oklch(0.32  0.06  260);
    --ink-3:     oklch(0.50  0.05  255);
    --ink-4:     oklch(0.68  0.04  255);
    --rule:      oklch(0.90  0.020 255);
    --rule-2:    oklch(0.95  0.014 255);

    --sidebar-grad: linear-gradient(180deg, oklch(0.20 0.075 268) 0%, oklch(0.26 0.090 262) 50%, oklch(0.32 0.105 258) 100%);
    --sidebar-ink: oklch(0.86 0.02 250);

    /* Accents */
    --accent:    oklch(0.55  0.18  255);
    --accent-2:  oklch(0.68  0.16  250);
    --accent-3:  oklch(0.72  0.14  220);
    --accent-soft: oklch(0.94 0.04 255);

    --pos:       oklch(0.62  0.13  165);
    --warn:      oklch(0.72  0.13   75);
    --neg:       oklch(0.60  0.18   18);

    --shadow-sm: 0 1px 0 oklch(0.20 0.08 260 / 0.06);
    --shadow:    0 1px 2px oklch(0.20 0.08 260 / 0.06), 0 8px 24px oklch(0.20 0.08 260 / 0.08);

    --radius:   12px;
    --radius-sm: 7px;
  }

  *{ box-sizing: border-box; }
  html, body { margin:0; padding:0; }
  body{
    font-family: "Geist", ui-sans-serif, system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(900px 500px at 0% 0%, oklch(0.92 0.05 260 / 0.6), transparent 60%),
      radial-gradient(800px 600px at 100% 0%, oklch(0.94 0.04 230 / 0.5), transparent 60%),
      linear-gradient(180deg, oklch(0.98 0.012 255), oklch(0.95 0.022 258));
    background-attachment: fixed;
    color: var(--ink);
    font-size: 13px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    font-feature-settings: "ss01","cv11";
    letter-spacing: -0.005em;
  }

  .mono{ font-family: "Geist Mono", ui-monospace, SFMono-Regular, monospace; font-feature-settings: "tnum","zero"; }

  /* ─────────── App shell ─────────── */
  .app{
    display: grid;
    grid-template-columns: 260px 1fr;
    height: 100vh;
    width: 100vw;
    overflow: hidden;
  }

  /* ─────────── Sidebar ─────────── */
  .sidebar{
    background: var(--sidebar-grad);
    border-right: 1px solid oklch(0.18 0.06 268);
    display: flex; flex-direction: column;
    overflow: hidden;
    color: var(--sidebar-ink);
    position: relative;
  }
  .sidebar::before{
    content:"";
    position: absolute; inset: 0;
    background: radial-gradient(600px 400px at -20% 0%, oklch(0.45 0.18 270 / 0.35), transparent 60%),
                radial-gradient(500px 400px at 120% 100%, oklch(0.55 0.16 220 / 0.25), transparent 60%);
    pointer-events: none;
  }
  .sidebar > *{ position: relative; z-index: 1; }

  .brand{
    padding: 18px 18px 14px;
    border-bottom: 1px solid oklch(1 0 0 / 0.08);
    display: flex; align-items: center; gap: 11px;
  }
  .brand-mark{
    width: 32px; height: 32px;
    border-radius: 8px;
    background: linear-gradient(135deg, oklch(0.75 0.16 220), oklch(0.55 0.18 270));
    color: oklch(1 0 0);
    display: grid; place-items: center;
    font-weight: 600; font-size: 16px;
    letter-spacing: -0.02em;
    font-family: "Instrument Serif", serif;
    font-style: italic;
    box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.3), 0 4px 12px oklch(0.4 0.18 260 / 0.4);
  }
  .brand-name{ display: flex; flex-direction: column; line-height: 1.15; }
  .brand-name b{ font-weight: 500; font-size: 13px; color: oklch(0.97 0.01 250); }
  .brand-name span{ font-size: 11px; color: oklch(0.75 0.04 250); }
  .sync-pill{
    margin-left: auto;
    display: inline-flex; align-items: center; gap: 5px;
    font-size: 10.5px; color: var(--pos);
    padding: 3px 7px;
    border: 1px solid color-mix(in oklch, var(--pos) 35%, transparent);
    background: color-mix(in oklch, var(--pos) 8%, transparent);
    border-radius: 999px;
    font-weight: 500;
  }
  .sync-pill::before{
    content:""; width: 5px; height: 5px; border-radius: 999px;
    background: var(--pos);
    box-shadow: 0 0 0 3px color-mix(in oklch, var(--pos) 20%, transparent);
  }

  .nav-section{
    padding: 16px 14px 8px;
  }
  .nav-section h6{
    margin: 0 8px 6px;
    font-size: 10px;
    font-weight: 500;
    text-transform: uppercase;
    letter-spacing: 0.12em;
    color: oklch(0.65 0.04 250);
  }
  .nav a{
    display: flex; align-items: center; gap: 9px;
    padding: 7px 10px;
    border-radius: 6px;
    color: var(--sidebar-ink);
    font-size: 13px;
    font-weight: 400;
    text-decoration: none;
    cursor: pointer;
  }
  .nav a{ color: oklch(0.85 0.03 250); }
  .nav a:hover{ background: oklch(1 0 0 / 0.06); color: oklch(0.97 0.01 250); }
  .nav a.active{
    background: linear-gradient(135deg, oklch(0.55 0.18 255), oklch(0.45 0.16 270));
    color: oklch(1 0 0);
    font-weight: 500;
    box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.18), 0 4px 12px oklch(0.30 0.16 260 / 0.4);
  }
  .nav a .ico{ width: 14px; height: 14px; opacity: 0.85; }

  .search-row{
    padding: 10px 14px 6px;
  }
  .search{
    position: relative;
  }
  .search input{
    width: 100%;
    padding: 7px 10px 7px 28px;
    background: oklch(1 0 0 / 0.08);
    border: 1px solid oklch(1 0 0 / 0.12);
    border-radius: 7px;
    font: inherit;
    color: oklch(0.97 0.01 250);
    outline: none;
  }
  .search input::placeholder{ color: oklch(0.7 0.04 250); }
  .search svg{ color: oklch(0.7 0.04 250) !important; }
  .search input:focus{ border-color: var(--accent-2); box-shadow: 0 0 0 3px color-mix(in oklch, var(--accent) 12%, transparent); }
  .search svg{ position: absolute; left: 9px; top: 50%; transform: translateY(-50%); color: var(--ink-4); }

  .new-patient{
    margin: 8px 14px 12px;
    display: inline-flex; align-items: center; justify-content: center; gap: 6px;
    padding: 9px 10px;
    background: linear-gradient(135deg, oklch(0.95 0.02 250), oklch(0.85 0.04 240));
    color: oklch(0.22 0.08 265);
    border-radius: 7px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    border: 0;
    box-shadow: inset 0 1px 0 oklch(1 0 0 / 0.6), 0 4px 12px oklch(0.20 0.08 260 / 0.3);
  }
  .new-patient:hover{ filter: brightness(1.05); }

  .toggle-row{
    margin: 4px 14px 8px;
    display: flex; align-items: center; gap: 8px;
    color: oklch(0.78 0.03 250);
    font-size: 12px;
    padding: 5px 8px;
    cursor: pointer;
    border-radius: 6px;
  }
  .toggle-row:hover{ background: oklch(1 0 0 / 0.05); }
  .toggle{
    width: 22px; height: 13px;
    background: oklch(1 0 0 / 0.15);
    border-radius: 999px;
    position: relative;
  }
  .toggle::after{
    content:""; position: absolute; top: 2px; left: 2px;
    width: 9px; height: 9px; border-radius: 999px;
    background: oklch(0.95 0.01 250);
    box-shadow: 0 1px 2px oklch(0 0 0 / 0.25);
  }

  .patients{
    margin-top: 4px;
    flex: 1;
    overflow-y: auto;
    padding: 4px 14px 24px;
  }
  .patients::-webkit-scrollbar{ width: 6px; }
  .patients::-webkit-scrollbar-thumb{ background: oklch(1 0 0 / 0.15); border-radius: 999px; }

  .patient{
    display: flex; align-items: center; gap: 9px;
    padding: 6px 8px;
    border-radius: 6px;
    color: oklch(0.84 0.03 250);
    font-size: 13px;
    cursor: pointer;
  }
  .patient:hover{ background: oklch(1 0 0 / 0.06); color: oklch(0.97 0.01 250); }
  .patient .dot{
    width: 6px; height: 6px; border-radius: 999px;
    background: oklch(0.6 0.04 250);
    flex-shrink: 0;
  }
  .patient.active-p .dot{ background: oklch(0.75 0.15 165); box-shadow: 0 0 0 3px oklch(0.75 0.15 165 / 0.18); }
  .patient .meta{
    margin-left: auto;
    font-size: 10.5px;
    color: oklch(0.62 0.04 250);
    font-family: "Geist Mono", monospace;
  }

  .sidebar-foot{
    padding: 12px 18px;
    border-top: 1px solid oklch(1 0 0 / 0.08);
    font-size: 11px;
    color: oklch(0.7 0.03 250);
    display: flex; align-items: center; gap: 10px;
    background: linear-gradient(180deg, transparent, oklch(0.18 0.06 268 / 0.5));
  }
  .sidebar-foot .avatar{
    width: 22px; height: 22px;
    border-radius: 999px;
    background: linear-gradient(135deg, oklch(0.7 0.08 215), oklch(0.5 0.08 250));
    color: oklch(1 0 0);
    display: grid; place-items: center;
    font-size: 10px; font-weight: 600;
  }

  /* ─────────── Main ─────────── */
  .main{
    overflow-y: auto;
    background: var(--bg);
  }

  .topbar{
    position: sticky; top: 0;
    z-index: 5;
    background: linear-gradient(180deg, oklch(0.98 0.018 255 / 0.85), oklch(0.96 0.022 255 / 0.7));
    backdrop-filter: blur(12px);
    border-bottom: 1px solid oklch(0.85 0.04 255 / 0.7);
    padding: 14px 28px;
    display: flex; align-items: center; gap: 18px;
  }
  .crumbs{
    display: flex; align-items: center; gap: 8px;
    font-size: 12.5px; color: var(--ink-3);
  }
  .topbar .crumbs b{ color: oklch(0.20 0.06 260); }
  .crumbs span{ color: var(--ink-4); }

  .top-actions{
    margin-left: auto;
    display: flex; align-items: center; gap: 6px;
  }
  .iconbtn{
    width: 30px; height: 30px;
    display: grid; place-items: center;
    border: 1px solid oklch(0.85 0.04 255 / 0.6);
    background: linear-gradient(180deg, oklch(1 0 0 / 0.7), oklch(0.97 0.012 255 / 0.5));
    color: var(--ink-2);
    border-radius: 7px;
    cursor: pointer;
    backdrop-filter: blur(4px);
  }
  .iconbtn:hover{ color: var(--ink); border-color: oklch(0.55 0.18 255 / 0.5); box-shadow: 0 0 0 3px oklch(0.55 0.18 255 / 0.08); }

  .period{
    display: inline-flex; align-items: center;
    border: 1px solid oklch(0.85 0.04 255 / 0.6);
    border-radius: 7px;
    background: linear-gradient(180deg, oklch(1 0 0 / 0.7), oklch(0.97 0.012 255 / 0.5));
    overflow: hidden;
    backdrop-filter: blur(4px);
  }
  .period button{
    background: transparent; border: 0;
    padding: 5px 10px;
    font: inherit; font-size: 12px;
    color: var(--ink-3);
    cursor: pointer;
    border-right: 1px solid var(--rule);
  }
  .period button:last-child{ border-right: 0; }
  .period button.on{ background: linear-gradient(135deg, oklch(0.40 0.16 265), oklch(0.30 0.14 270)); color: oklch(1 0 0); }

  /* ─────────── Page header ─────────── */
  .page{
    padding: 28px 28px 40px;
    max-width: 1480px;
  }

  .page-head{
    display: flex; align-items: flex-end; gap: 24px;
    margin-bottom: 26px;
  }
  .page-head h1{
    margin: 0;
    font-size: 26px;
    font-weight: 500;
    letter-spacing: -0.02em;
    color: var(--ink);
  }
  .page-head h1 em{
    font-family: "Instrument Serif", serif;
    font-style: italic;
    font-weight: 400;
    color: var(--ink-3);
  }
  .page-head .sub{
    color: var(--ink-3);
    font-size: 13px;
    margin-top: 4px;
  }
  .head-right{
    margin-left: auto;
    display: flex; align-items: center; gap: 18px;
    color: var(--ink-3);
    font-size: 12px;
  }
  .head-right .stat{
    display: flex; flex-direction: column; line-height: 1.2;
  }
  .head-right .stat b{
    color: var(--ink);
    font-weight: 500;
    font-size: 14px;
    font-family: "Geist Mono", monospace;
  }

  /* ─────────── KPI strip ─────────── */
  .kpis{
    display: grid;
    grid-template-columns: 1.4fr 1fr 1fr 1fr 1.1fr 1fr;
    gap: 0;
    border: 1px solid oklch(0.85 0.04 255 / 0.6);
    background: linear-gradient(180deg, oklch(1 0 0 / 0.9), oklch(0.99 0.008 250 / 0.75));
    backdrop-filter: blur(12px);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
  }
  .kpi{
    padding: 16px 18px 18px;
    border-right: 1px solid var(--rule);
    display: flex; flex-direction: column; gap: 4px;
    position: relative;
  }
  .kpi:last-child{ border-right: 0; }
  .kpi.primary{
    background:
      radial-gradient(400px 220px at 90% 0%, oklch(0.45 0.20 230 / 0.35), transparent 60%),
      radial-gradient(380px 240px at 0% 100%, oklch(0.40 0.18 280 / 0.4), transparent 60%),
      linear-gradient(160deg, oklch(0.22 0.09 268) 0%, oklch(0.16 0.08 270) 100%);
    color: oklch(0.96 0.01 250);
    position: relative;
  }
  .kpi.primary::before{
    content:""; position: absolute; inset: 0;
    background: linear-gradient(180deg, oklch(1 0 0 / 0.06), transparent 40%);
    pointer-events: none;
  }
  .kpi.primary > *{ position: relative; }
  .kpi.primary .kpi-label{ color: oklch(0.78 0.04 250); }
  .kpi.primary .kpi-sub{ color: oklch(0.78 0.04 250); }

  .kpi-label{
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.11em;
    color: var(--ink-3);
    font-weight: 500;
    display: flex; align-items: center; gap: 6px;
  }
  .kpi-value{
    font-family: "Geist Mono", monospace;
    font-size: 24px;
    font-weight: 500;
    letter-spacing: -0.02em;
    color: var(--ink);
    margin-top: 6px;
    font-feature-settings: "tnum";
  }
  .kpi.primary .kpi-value{ color: oklch(0.99 0 0); font-size: 28px; }
  .kpi-value.pos{ color: var(--pos); }
  .kpi-value.neg{ color: var(--neg); }
  .kpi-value.acc{ background: linear-gradient(135deg, oklch(0.55 0.18 255), oklch(0.65 0.16 230)); -webkit-background-clip: text; background-clip: text; color: transparent; }
  .kpi-sub{
    font-size: 11.5px;
    color: var(--ink-3);
    margin-top: 4px;
    display: flex; align-items: center; gap: 6px;
  }
  .delta{
    font-family: "Geist Mono", monospace;
    font-size: 11px;
    padding: 1px 6px;
    border-radius: 4px;
    background: color-mix(in oklch, var(--pos) 12%, transparent);
    color: var(--pos);
    border: 1px solid color-mix(in oklch, var(--pos) 25%, transparent);
  }
  .delta.down{
    background: color-mix(in oklch, var(--neg) 10%, transparent);
    color: var(--neg);
    border-color: color-mix(in oklch, var(--neg) 25%, transparent);
  }
  .delta.flat{
    background: var(--rule-2); color: var(--ink-3); border-color: var(--rule);
  }

  .kpi .spark{
    position: absolute;
    right: 14px; top: 14px;
    width: 64px; height: 22px;
    color: var(--ink-4);
    opacity: 0.7;
  }
  .kpi.primary .spark{ color: oklch(0.7 0.06 215); opacity: 0.9; }

  /* ─────────── Grid below KPIs ─────────── */
  .grid{
    margin-top: 22px;
    display: grid;
    grid-template-columns: 2fr 1fr;
    gap: 18px;
  }

  .card{
    background: linear-gradient(180deg, oklch(1 0 0 / 0.85), oklch(0.99 0.008 250 / 0.7));
    backdrop-filter: blur(12px);
    border: 1px solid oklch(0.85 0.04 255 / 0.6);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    overflow: hidden;
  }
  .card-head{
    display: flex; align-items: center; gap: 14px;
    padding: 14px 18px 12px;
    border-bottom: 1px solid var(--rule-2);
  }
  .card-head h3{
    margin: 0;
    font-size: 13px;
    font-weight: 500;
    color: var(--ink);
    letter-spacing: -0.005em;
  }
  .card-head .h-sub{
    font-size: 11.5px; color: var(--ink-3);
  }
  .card-head .h-actions{
    margin-left: auto;
    display: flex; align-items: center; gap: 4px;
  }
  .chip{
    font-size: 11px;
    padding: 4px 8px;
    border-radius: 999px;
    background: var(--rule-2);
    color: var(--ink-3);
    border: 1px solid var(--rule);
    cursor: pointer;
  }
  .chip.on{ background: linear-gradient(135deg, oklch(0.40 0.16 265), oklch(0.30 0.14 270)); color: oklch(1 0 0); border-color: oklch(0.30 0.14 270); box-shadow: 0 2px 6px oklch(0.30 0.14 270 / 0.3); }

  /* ─────────── Chart (revenue) ─────────── */
  .chart-wrap{
    padding: 18px 18px 14px;
    position: relative;
  }
  .chart{
    width: 100%;
    height: 240px;
    display: block;
  }
  .legend{
    display: flex; gap: 18px;
    padding: 0 18px 14px;
    font-size: 11.5px;
    color: var(--ink-3);
  }
  .legend .lk{
    display: inline-flex; align-items: center; gap: 6px;
  }
  .legend .swatch{ width: 9px; height: 9px; border-radius: 2px; }

  /* ─────────── Right column ─────────── */
  .alerts-list{ padding: 6px 0 4px; }
  .alert{
    display: grid;
    grid-template-columns: 44px 1fr auto;
    align-items: center;
    gap: 12px;
    padding: 11px 18px;
    border-bottom: 1px solid var(--rule-2);
    cursor: pointer;
  }
  .alert:last-child{ border-bottom: 0; }
  .alert:hover{ background: var(--rule-2); }
  .alert .num{
    font-family: "Geist Mono", monospace;
    font-size: 12px;
    text-align: right;
    color: var(--warn);
    background: color-mix(in oklch, var(--warn) 10%, transparent);
    border: 1px solid color-mix(in oklch, var(--warn) 25%, transparent);
    border-radius: 5px;
    padding: 2px 6px;
    width: max-content;
    margin-left: auto;
  }
  .alert .name{ color: var(--ink); font-weight: 500; font-size: 13px; }
  .alert .why{ color: var(--ink-3); font-size: 11.5px; margin-top: 1px; }
  .alert .right{ font-size: 11.5px; color: var(--ink-3); display: flex; align-items: center; gap: 8px; }
  .alert.this-week .num{ color: var(--accent); background: color-mix(in oklch, var(--accent) 10%, transparent); border-color: color-mix(in oklch, var(--accent) 25%, transparent); }

  /* ─────────── Previsión donut ─────────── */
  .donut-card{ padding: 0; }
  .donut-row{
    display: grid;
    grid-template-columns: 130px 1fr;
    gap: 18px;
    padding: 16px 18px 18px;
    align-items: center;
  }
  .donut-svg{ width: 130px; height: 130px; }
  .prev-rows{
    display: flex; flex-direction: column;
    gap: 8px;
  }
  .prev-row{
    display: grid;
    grid-template-columns: 12px 1fr auto auto;
    align-items: center;
    gap: 10px;
    font-size: 12px;
  }
  .prev-row .sw{ width: 9px; height: 9px; border-radius: 2px; }
  .prev-row .lab{ color: var(--ink); }
  .prev-row .pct{ color: var(--ink-3); font-family: "Geist Mono", monospace; font-size: 11.5px; }
  .prev-row .amt{ color: var(--ink); font-family: "Geist Mono", monospace; font-size: 12px; min-width: 76px; text-align: right; }

  /* ─────────── Sessions schedule ─────────── */
  .sched{
    padding: 0;
  }
  .sched table{
    width: 100%;
    border-collapse: collapse;
    font-size: 12.5px;
  }
  .sched th{
    text-align: left;
    font-weight: 500;
    font-size: 10.5px;
    text-transform: uppercase;
    letter-spacing: 0.1em;
    color: var(--ink-4);
    padding: 10px 18px;
    border-bottom: 1px solid var(--rule-2);
    background: var(--rule-2);
  }
  .sched td{
    padding: 10px 18px;
    border-bottom: 1px solid var(--rule-2);
    color: var(--ink-2);
    vertical-align: middle;
  }
  .sched tr:last-child td{ border-bottom: 0; }
  .sched tr:hover td{ background: var(--rule-2); }
  .sched td.t{ font-family: "Geist Mono", monospace; color: var(--ink-3); white-space: nowrap; width: 96px; }
  .sched td.p{ color: var(--ink); font-weight: 500; }
  .sched td.amt{ font-family: "Geist Mono", monospace; text-align: right; white-space: nowrap; }
  .tag{
    font-size: 10.5px;
    padding: 2px 7px;
    border-radius: 4px;
    border: 1px solid var(--rule);
    background: var(--paper);
    color: var(--ink-3);
    font-weight: 500;
    white-space: nowrap;
  }
  .tag.fonasa{ color: oklch(0.40 0.16 265); border-color: color-mix(in oklch, oklch(0.40 0.16 265) 25%, transparent); background: color-mix(in oklch, oklch(0.40 0.16 265) 8%, transparent); }
  .tag.colmena{ color: oklch(0.50 0.14 220); border-color: color-mix(in oklch, oklch(0.50 0.14 220) 25%, transparent); background: color-mix(in oklch, oklch(0.50 0.14 220) 8%, transparent); }
  .tag.particular{ color: oklch(0.55 0.13 195); border-color: color-mix(in oklch, oklch(0.55 0.13 195) 25%, transparent); background: color-mix(in oklch, oklch(0.55 0.13 195) 8%, transparent); }
  .tag.cruzblanca{ color: oklch(0.50 0.16 290); border-color: color-mix(in oklch, oklch(0.50 0.16 290) 25%, transparent); background: color-mix(in oklch, oklch(0.50 0.16 290) 8%, transparent); }
  .status-dot{ display: inline-block; width: 6px; height: 6px; border-radius: 999px; margin-right: 6px; }
  .status-dot.paid{ background: var(--pos); }
  .status-dot.pend{ background: var(--neg); }
  .status-dot.bill{ background: var(--accent-2); }

  .footer-links{
    display: flex; gap: 18px;
    padding: 24px 0 10px;
    color: var(--ink-4);
    font-size: 11px;
  }

  /* tighter on smaller widths */
  @media (max-width: 1280px){
    .kpis{ grid-template-columns: 1.4fr 1fr 1fr 1fr 1fr 1fr; }
    .kpi-value{ font-size: 22px; }
    .kpi.primary .kpi-value{ font-size: 24px; }
  }


/* ── EXTRA: functional-only components not in static ─────────────── */

/* LOGIN (from functional) */
.login-screen{position:fixed;inset:0;background:linear-gradient(135deg,#0d2240 0%,#1b3f6e 60%,#2a5298 100%);display:flex;align-items:center;justify-content:center;z-index:1000}
.login-box{background:rgba(255,255,255,.12);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.2);border-radius:20px;padding:38px 34px;width:100%;max-width:340px;text-align:center;box-shadow:0 12px 40px rgba(13,34,64,.3),0 2px 8px rgba(13,34,64,.15)}
.login-psi{font-size:54px;font-family:serif;color:#fff;margin-bottom:6px;font-weight:700;line-height:1;text-shadow:0 2px 20px rgba(0,0,0,.3)}
.login-title{font-size:18px;font-weight:600;color:#fff;margin-bottom:4px}
.login-sub{font-size:13px;color:rgba(255,255,255,.55);margin-bottom:26px}
.login-label{display:block;font-size:12px;color:rgba(255,255,255,.65);font-weight:500;margin-bottom:5px;text-align:left}
.login-input{width:100%;padding:11px 14px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);border-radius:9px;color:#fff;font-family:inherit;font-size:14px;outline:none;transition:all .2s;margin-bottom:12px}
.login-input::placeholder{color:rgba(255,255,255,.35)}
.login-input:focus{background:rgba(255,255,255,.18);border-color:rgba(255,255,255,.4);box-shadow:0 0 0 3px rgba(255,255,255,.1)}
.login-btn{width:100%;padding:12px;background:rgba(255,255,255,.95);border:none;border-radius:9px;color:#1b3f6e;font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;margin-top:4px}
.login-btn:hover{background:#fff;transform:translateY(-1px);box-shadow:0 4px 16px rgba(0,0,0,.2)}
.login-btn:disabled{opacity:.6;cursor:not-allowed;transform:none}
.login-error{font-size:12px;color:#fca5a5;margin-top:10px;min-height:18px;background:rgba(220,38,38,.15);border:1px solid rgba(220,38,38,.25);border-radius:7px;padding:6px 10px;display:none}
.login-error.show{display:block}
.login-spinner{display:inline-block;width:14px;height:14px;border:2px solid rgba(27,63,110,.2);border-top-color:#1b3f6e;border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}

/* APP SHELL */
html,body{height:100%;overflow:hidden;background:var(--bg);-webkit-font-smoothing:antialiased}
.app{display:grid;grid-template-columns:260px 1fr;height:100vh;height:100dvh;width:100vw;overflow:hidden}

/* SIDEBAR — using static brand/nav styles, adding functional interactivity classes */
.sidebar{background:var(--sidebar-grad);border-right:1px solid oklch(0.18 0.06 268);display:flex;flex-direction:column;overflow:hidden;position:relative;transition:transform .28s cubic-bezier(.4,0,.2,1);z-index:50}
.sidebar::before{content:"";position:absolute;inset:0;background:radial-gradient(600px 400px at -20% 0%,oklch(0.45 0.18 270/.35),transparent 60%),radial-gradient(500px 400px at 120% 100%,oklch(0.55 0.16 220/.25),transparent 60%);pointer-events:none}
.sidebar>*{position:relative;z-index:1}
.sb-overlay-bg{display:none;position:fixed;inset:0;background:rgba(13,34,64,.5);backdrop-filter:blur(4px);z-index:49}
.sb-overlay-bg.visible{display:block}

/* BRAND BAR */
.brand{padding:18px 18px 14px;border-bottom:1px solid oklch(1 0 0/.08);display:flex;align-items:center;gap:11px}
.brand-mark{width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,oklch(0.75 0.16 220),oklch(0.55 0.18 270));color:#fff;display:grid;place-items:center;font-weight:600;font-size:16px;font-family:"Instrument Serif",serif;font-style:italic;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 4px 12px rgba(40,80,200,.4)}
.brand-name{display:flex;flex-direction:column;line-height:1.15}
.brand-name b{font-weight:500;font-size:13px;color:oklch(0.97 0.01 250)}
.brand-name span{font-size:11px;color:oklch(0.75 0.04 250)}
.sync-pill{margin-left:auto;display:inline-flex;align-items:center;gap:5px;font-size:10.5px;color:#6ee7b7;padding:3px 7px;border:1px solid rgba(52,211,153,.3);background:rgba(52,211,153,.1);border-radius:999px;font-weight:500;transition:all .3s;flex-shrink:0}
.sync-pill::before{content:"";width:5px;height:5px;border-radius:999px;background:#6ee7b7}
.sync-pill.saving{color:#fcd34d;border-color:rgba(251,191,36,.3);background:rgba(251,191,36,.1)}
.sync-pill.saving::before{background:#fcd34d}
.sync-pill.error{color:#fca5a5;border-color:rgba(248,113,113,.3);background:rgba(248,113,113,.1)}
.sync-pill.error::before{background:#fca5a5}

/* NAV */
.nav-section{padding:16px 14px 8px}
.nav-section h6{margin:0 8px 6px;font-size:10px;font-weight:500;text-transform:uppercase;letter-spacing:.12em;color:oklch(0.65 0.04 250)}
.nb{display:flex;align-items:center;gap:9px;width:100%;padding:7px 10px;border:none;background:none;color:oklch(0.85 0.03 250);font-family:inherit;font-size:13px;border-radius:6px;cursor:pointer;text-align:left;transition:all .15s}
.nb:hover{background:oklch(1 0 0/.06);color:oklch(0.97 0.01 250)}
.nb.active{background:linear-gradient(135deg,oklch(0.55 0.18 255),oklch(0.45 0.16 270));color:#fff;font-weight:500;box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 4px 12px rgba(40,40,180,.4)}
.nb.alta{opacity:.45;font-style:italic}
.nb .ico{width:14px;height:14px;opacity:.85;flex-shrink:0}

/* SEARCH IN SIDEBAR */
.search-row{padding:10px 14px 6px}
.search{position:relative}
.search svg{position:absolute;left:9px;top:50%;transform:translateY(-50%);color:oklch(0.7 0.04 250);pointer-events:none}
.search input{width:100%;padding:7px 10px 7px 28px;background:oklch(1 0 0/.08);border:1px solid oklch(1 0 0/.12);border-radius:7px;font:inherit;color:oklch(0.97 0.01 250);outline:none;transition:all .2s}
.search input::placeholder{color:oklch(0.7 0.04 250)}
.search input:focus{border-color:oklch(0.68 0.16 250);box-shadow:0 0 0 3px rgba(59,91,219,.12)}

/* NEW PATIENT BTN */
.new-patient{margin:8px 14px 4px;display:flex;align-items:center;justify-content:center;gap:6px;padding:8px 10px;background:linear-gradient(135deg,oklch(0.95 0.02 250),oklch(0.85 0.04 240));color:oklch(0.22 0.08 265);border-radius:7px;font-size:12.5px;font-weight:600;cursor:pointer;border:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.6),0 4px 12px rgba(20,30,60,.3);width:calc(100% - 28px)}
.new-patient:hover{filter:brightness(1.05)}

/* TOGGLE / FILTER */
.filter-toggle{margin:4px 14px 0;display:flex;align-items:center;gap:8px;font-size:11px;color:oklch(0.78 0.03 250);cursor:pointer;padding:5px 8px;border-radius:6px;transition:all .15s;border:none;background:none;width:calc(100% - 28px)}
.filter-toggle:hover{background:oklch(1 0 0/.05);color:oklch(0.9 0.02 250)}

/* PATIENT LIST */
.pat-scroll{flex:1;overflow-y:auto;padding:4px 14px 24px;margin-top:4px}
.pat-scroll::-webkit-scrollbar{width:4px}
.pat-scroll::-webkit-scrollbar-thumb{background:oklch(1 0 0/.15);border-radius:999px}

/* SIDEBAR FOOTER */
.sb-footer{padding:12px 18px;border-top:1px solid oklch(1 0 0/.08);font-size:11px;color:oklch(0.7 0.03 250);display:flex;align-items:center;gap:10px;background:linear-gradient(180deg,transparent,oklch(0.18 0.06 268/.5))}

/* MAIN AREA */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;background:var(--bg)}
.main-header{height:56px;min-height:56px;padding:0 20px;border-bottom:1px solid rgba(200,215,240,.4);display:flex;align-items:center;gap:10px;background:rgba(244,246,251,.85);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transition:background .25s}
.hamburger{display:none;width:34px;height:34px;background:rgba(255,255,255,.7);border:1px solid rgba(200,215,240,.7);border-radius:9px;cursor:pointer;align-items:center;justify-content:center;font-size:15px;color:#4a5578;flex-shrink:0}
.h-title{font-size:15px;font-weight:600;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:#1a2035}
.h-actions{display:flex;gap:7px;flex-shrink:0;align-items:center}
.main-body{flex:1;overflow-y:auto;padding:24px 28px}
.main-body::-webkit-scrollbar{width:4px}
.main-body::-webkit-scrollbar-thumb{background:rgba(26,63,110,.12);border-radius:2px}

/* BUTTONS (functional style, matching static palette) */
.btn{padding:7px 13px;border-radius:7px;font-family:inherit;font-size:12px;font-weight:500;cursor:pointer;border:1px solid rgba(200,215,240,.7);background:rgba(255,255,255,.7);backdrop-filter:blur(12px);color:#4a5578;transition:all .15s;white-space:nowrap;box-shadow:0 1px 2px rgba(26,63,110,.06)}
.btn:hover{background:rgba(255,255,255,.9);color:#1a2035}
.btn-primary{background:linear-gradient(135deg,#2a5298,#1b3f6e);border-color:transparent;color:#fff;box-shadow:0 4px 14px rgba(27,63,110,.35)}
.btn-primary:hover{filter:brightness(1.08);transform:translateY(-1px)}
.btn-danger{color:#dc2626;border-color:rgba(220,38,38,.15);background:rgba(220,38,38,.08);backdrop-filter:none;box-shadow:none}
.btn-danger:hover{background:rgba(220,38,38,.14)}
.btn-warning{color:#b45309;border-color:rgba(180,83,9,.15);background:rgba(180,83,9,.09);backdrop-filter:none;box-shadow:none}
.btn-success{color:#059669;border-color:rgba(5,150,105,.15);background:rgba(5,150,105,.09);backdrop-filter:none;box-shadow:none}
.btn-icon{width:32px;height:32px;padding:0;display:flex;align-items:center;justify-content:center;font-size:14px;border-radius:7px}
.btn-sm{padding:4px 10px;font-size:11px}

/* GLASS CARDS (functional) */
.glass{background:rgba(255,255,255,.75);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.88);border-radius:14px;box-shadow:0 8px 32px rgba(26,63,110,.1),0 1.5px 4px rgba(26,63,110,.06)}

/* METRICS (patient view) */
.metric-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:11px;margin-bottom:16px}
.metric{background:rgba(255,255,255,.75);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.88);border-radius:14px;padding:16px 18px;box-shadow:0 8px 32px rgba(26,63,110,.1),0 1.5px 4px rgba(26,63,110,.06)}
.metric.navy{background:linear-gradient(135deg,rgba(13,34,64,.93),rgba(27,63,110,.88));border:1px solid rgba(255,255,255,.14);box-shadow:0 12px 40px rgba(13,34,64,.3),0 2px 8px rgba(13,34,64,.15)}
.metric.navy .m-label{color:rgba(255,255,255,.45)}
.metric.navy .m-value{color:#fff}
.metric.navy .m-sub{color:rgba(255,255,255,.3)}
.m-label{font-size:10.5px;color:#7a88a8;font-weight:600;text-transform:uppercase;letter-spacing:.07em;margin-bottom:7px}
.m-value{font-size:20px;font-weight:600;line-height:1.1;color:#1a2035}
.m-sub{font-size:11px;color:#7a88a8;margin-top:4px}

/* BADGES */
.badge{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600}
.b-cobrado{background:rgba(5,150,105,.09);color:#059669}
.b-pagado{background:rgba(37,99,235,.09);color:#2563eb}
.b-pendiente{background:rgba(220,38,38,.08);color:#dc2626}
.b-empty{background:rgba(26,63,110,.06);color:#7a88a8}
.b-alta{background:rgba(180,83,9,.09);color:#b45309}

/* TABLE (patient sessions) */
.tw{overflow-x:auto;border-radius:14px;border:1px solid rgba(255,255,255,.88);background:rgba(255,255,255,.75);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);box-shadow:0 8px 32px rgba(26,63,110,.1)}
table{width:100%;border-collapse:collapse;font-size:13px}
th{padding:10px 14px;text-align:left;font-size:10px;font-weight:700;color:#7a88a8;text-transform:uppercase;letter-spacing:.07em;background:rgba(255,255,255,.35);border-bottom:1px solid rgba(200,215,240,.5);white-space:nowrap}
th.sortable{cursor:pointer;user-select:none}
th.sortable:hover{color:#1a2035;background:rgba(255,255,255,.55)}
td{padding:11px 14px;border-bottom:1px solid rgba(26,63,110,.05);vertical-align:middle;color:#4a5578}
tr:last-child td{border-bottom:none}
tbody tr{background:transparent;transition:background .1s}
tbody tr:hover{background:rgba(26,63,110,.03)}

/* TABS */
.tabs{display:flex;border-bottom:1px solid rgba(200,215,240,.5);margin-bottom:18px;overflow-x:auto;gap:2px}
.tab{padding:9px 16px;font-size:13px;font-weight:500;color:#7a88a8;background:none;border:none;border-bottom:2px solid transparent;cursor:pointer;font-family:inherit;transition:all .15s;margin-bottom:-1px;white-space:nowrap}
.tab.active{color:#1a2035;border-bottom-color:#1b3f6e}

/* MONTH SUMMARY (resumen) */
.msummary{background:rgba(255,255,255,.75);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.88);border-radius:14px;padding:14px;box-shadow:0 8px 32px rgba(26,63,110,.1)}
.mrow{display:flex;justify-content:space-between;padding:5px 0;font-size:12px;border-bottom:1px solid rgba(26,63,110,.05)}
.mrow:last-of-type{border-bottom:none}
.mtotal{display:flex;justify-content:space-between;padding:8px 0 0;font-size:13px;font-weight:600;color:#1a2035}

/* SETTINGS */
.settings-card{background:rgba(255,255,255,.75);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.88);border-radius:14px;padding:20px;box-shadow:0 8px 32px rgba(26,63,110,.1);margin-bottom:16px}
.settings-card h4{font-size:13px;font-weight:600;margin-bottom:16px;color:#1a2035}
.tarifa-row{display:grid;grid-template-columns:1fr 80px 130px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid rgba(26,63,110,.06)}
.tarifa-row:last-child{border-bottom:none}
.tarifa-name{font-size:13px;color:#4a5578;font-weight:500}
.tarifa-year{font-size:11px;color:#7a88a8;text-align:center}
.theme-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.theme-card{border:2px solid rgba(200,215,240,.5);border-radius:14px;padding:14px;cursor:pointer;transition:all .2s;text-align:center;background:rgba(255,255,255,.75);backdrop-filter:blur(24px)}
.theme-card:hover{border-color:rgba(200,215,240,.9);transform:translateY(-2px)}
.theme-card.active{border-color:#1b3f6e;box-shadow:0 0 0 4px rgba(27,63,110,.1)}
.theme-preview{height:48px;border-radius:8px;margin-bottom:8px;display:flex;overflow:hidden}
.theme-preview .tp-sb{width:35%;border-radius:8px 0 0 8px}
.theme-preview .tp-main{flex:1;border-radius:0 8px 8px 0}
.theme-name{font-size:12px;font-weight:500;color:#4a5578}
.kbd{display:inline-block;padding:2px 7px;background:rgba(26,63,110,.08);border:1px solid rgba(200,215,240,.7);border-radius:5px;font-size:11px;font-family:"Geist Mono",monospace;color:#4a5578}

/* PIE (resumen) */
.pie-wrap{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.pie-legend{display:flex;flex-direction:column;gap:6px;flex:1;min-width:100px}
.pie-leg-item{display:flex;align-items:center;gap:7px;font-size:12px;color:#4a5578}
.pie-dot{width:9px;height:9px;border-radius:50%;flex-shrink:0}

/* SEARCH OVERLAY */
.search-overlay{position:fixed;inset:0;background:rgba(13,34,64,.45);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);display:flex;align-items:flex-start;justify-content:center;z-index:300;padding:60px 20px 20px;animation:fi .15s ease}
.search-box{background:rgba(255,255,255,.9);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.95);border-radius:16px;width:100%;max-width:560px;box-shadow:0 12px 40px rgba(13,34,64,.3);overflow:hidden}
.search-input-wrap{display:flex;align-items:center;gap:10px;padding:14px 16px;border-bottom:1px solid rgba(200,215,240,.5)}
.search-input-wrap input{flex:1;border:none;background:none;font-family:inherit;font-size:15px;color:#1a2035;outline:none}
.search-input-wrap input::placeholder{color:#7a88a8}
.search-results{max-height:400px;overflow-y:auto}
.search-group{padding:8px 0}
.search-group-title{font-size:10px;font-weight:700;color:#7a88a8;text-transform:uppercase;letter-spacing:.08em;padding:4px 16px 6px}
.search-item{display:flex;align-items:center;gap:10px;padding:9px 16px;cursor:pointer;transition:background .1s}
.search-item:hover{background:rgba(26,63,110,.04)}
.search-item-name{font-size:13px;font-weight:500;flex:1;color:#1a2035}
.search-item-detail{font-size:11px;color:#7a88a8}
.search-empty{padding:24px;text-align:center;color:#7a88a8;font-size:13px}

/* MODAL */
.overlay{position:fixed;inset:0;background:rgba(13,34,64,.45);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);display:flex;align-items:center;justify-content:center;z-index:200;padding:16px;animation:fi .15s ease}
@keyframes fi{from{opacity:0}to{opacity:1}}
.modal{background:rgba(255,255,255,.9);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.95);border-radius:18px;padding:28px;width:100%;max-width:430px;max-height:90vh;overflow-y:auto;box-shadow:0 12px 40px rgba(13,34,64,.3);animation:su .2s cubic-bezier(.4,0,.2,1)}
@keyframes su{from{transform:translateY(14px);opacity:0}to{transform:translateY(0);opacity:1}}
.modal h3{font-size:16px;font-weight:600;margin-bottom:20px;color:#1a2035}
.fg{margin-bottom:14px}
.fl{display:block;font-size:12px;color:#4a5578;font-weight:500;margin-bottom:5px}
.fi2,.fs{width:100%;padding:9px 12px;background:rgba(255,255,255,.55);border:1px solid rgba(200,215,240,.7);border-radius:9px;color:#1a2035;font-family:inherit;font-size:13px;outline:none;transition:all .2s;-webkit-appearance:none;appearance:none}
.fi2:focus,.fs:focus{border-color:#1b3f6e;box-shadow:0 0 0 3px rgba(27,63,110,.12);background:rgba(255,255,255,.75)}
.fr{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mf{display:flex;justify-content:flex-end;gap:8px;margin-top:22px;padding-top:16px;border-top:1px solid rgba(200,215,240,.4)}

/* OBS POPUP */
.obs-popup{position:fixed;inset:0;background:rgba(13,34,64,.45);backdrop-filter:blur(24px);display:flex;align-items:center;justify-content:center;z-index:300;padding:20px;animation:fi .15s ease}
.obs-box{background:rgba(255,255,255,.9);backdrop-filter:blur(24px);border:1px solid rgba(255,255,255,.95);border-radius:16px;padding:24px;width:100%;max-width:340px;box-shadow:0 12px 40px rgba(13,34,64,.3)}
.obs-box h4{font-size:14px;font-weight:600;margin-bottom:10px;color:#1a2035}
.obs-close{margin-top:16px;width:100%;padding:9px;background:rgba(255,255,255,.5);border:1px solid rgba(200,215,240,.7);border-radius:9px;font-family:inherit;font-size:13px;font-weight:500;cursor:pointer;color:#4a5578}
.obs-btn{background:none;border:none;cursor:pointer;font-size:16px;padding:2px 4px;border-radius:4px;line-height:1}
.obs-btn:hover{background:rgba(26,63,110,.06)}

/* PRIVATE MODE */
.private-val{filter:blur(6px);user-select:none;pointer-events:none}

/* LOADING/EMPTY */
.empty{text-align:center;padding:48px 20px;color:#7a88a8;font-size:13px}
.ei{font-size:36px;margin-bottom:10px;opacity:.4}
.loading{display:flex;flex-direction:column;align-items:center;justify-content:center;height:220px;gap:12px;color:#7a88a8;font-size:13px}
.spinner{width:26px;height:26px;border:2px solid rgba(26,63,110,.12);border-top-color:#1b3f6e;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.col-obs{display:none}
.stitle{font-size:10px;font-weight:700;color:#7a88a8;text-transform:uppercase;letter-spacing:.08em;margin-bottom:12px}
.next-badge{display:inline-block;padding:2px 8px;border-radius:5px;font-size:11px;background:rgba(27,63,110,.1);color:#1b3f6e;font-weight:500;margin-left:6px}

/* BOTTOM NAV */
.bottom-nav{display:none;height:64px;background:rgba(255,255,255,.85);backdrop-filter:blur(24px);-webkit-backdrop-filter:blur(24px);border-top:1px solid rgba(200,215,240,.5);justify-content:space-around;align-items:center;flex-shrink:0;padding-bottom:env(safe-area-inset-bottom,0px)}
.bn-item{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:#7a88a8;cursor:pointer;padding:6px 12px;border-radius:10px;transition:all .15s;font-weight:500}
.bn-item.active{color:#1b3f6e;background:rgba(27,63,110,.07)}
.bn-icon{font-size:20px;line-height:1}

/* PATIENT DETAIL extra cards */
.pdg{display:grid;grid-template-columns:1fr 170px;gap:16px;align-items:start}
.chart-row-mobile{display:grid;grid-template-columns:1fr 200px;gap:16px;margin-bottom:24px;align-items:start}

/* RESUMEN PIE+SUMMARY */
.bc2{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
.bbar{width:100%;border-radius:4px 4px 0 0;background:linear-gradient(180deg,rgba(59,130,246,.7),rgba(27,63,110,.85));min-height:3px;transition:height .4s ease}
.bbar:hover{filter:brightness(1.15)}
.bbar2{width:100%;border-radius:4px 4px 0 0;background:rgba(5,150,105,.25);min-height:3px;border:1px solid rgba(5,150,105,.3)}
.blbl{font-size:9px;color:#7a88a8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%;text-align:center}
.bval{font-size:8px;color:#7a88a8;white-space:nowrap}

/* THEMES */
[data-theme="green"]{
  --sidebar-grad:linear-gradient(180deg,#0a2318 0%,#1a5c3a 60%,#27804f 100%);
}
[data-theme="dark"]{
  --bg:linear-gradient(145deg,#080e1a,#0d1525,#111c30);
  --ink:#e8edf5;--ink-2:#8899bb;--ink-3:#556688;--ink-4:#334466;
  --rule:rgba(255,255,255,.1);--rule-2:rgba(255,255,255,.06);
  --paper:rgba(15,25,45,.8);
  --pos:#34d399;--neg:#f87171;--warn:#fbbf24;
  --accent:rgba(96,165,250,1);
}

/* MOBILE */
@media(max-width:768px){
  /* Layout */
  .app{grid-template-columns:1fr;overflow:hidden;width:100vw;max-width:100vw}
  .sidebar{position:fixed;top:0;left:0;bottom:0;width:280px;transform:translateX(-100%)}
  .sidebar.open{transform:translateX(0)}
  .hamburger{display:flex !important}
  /* Prevent horizontal overflow */
  .main{width:100%;overflow:hidden;max-width:100vw}
  .page{padding:12px;overflow-x:hidden;width:100%;box-sizing:border-box}
  /* KPI strip - 2 cols, primary full width */
  .kpis{grid-template-columns:1fr 1fr;border-radius:8px;overflow:hidden}
  .kpi:nth-child(1){grid-column:span 2;border-right:0}
  .kpi .spark{display:none}
  .kpi{padding:12px 14px;border-right:0;border-bottom:1px solid var(--rule);min-width:0}
  .kpi:last-child{border-bottom:0}
  .kpi:nth-child(even){border-right:0}
  /* Scale down KPI values to fit */
  .kpi-value{font-size:17px !important;word-break:break-word;overflow-wrap:break-word}
  .kpi.primary .kpi-value{font-size:20px !important}
  .kpi-label{font-size:9px;letter-spacing:.06em}
  .kpi-sub{font-size:9px}
  /* Tables - compress */
  td,th{padding:7px 8px;font-size:11px}
  table{font-size:11px}
  .col-obs{display:none}
  /* Grids stack */
  .grid{grid-template-columns:1fr;margin-top:14px;gap:12px}
  .grid2{grid-template-columns:1fr !important}
  .donut-row{grid-template-columns:1fr}
  .donut-svg{width:90px;height:90px;margin:0 auto}
  /* Bottom nav */
  .bottom-nav{display:flex !important}
  /* Other grids */
  .metric-grid{grid-template-columns:1fr 1fr !important}
  .metric.navy{grid-column:span 2}
  .fr{grid-template-columns:1fr}
  .pdg{grid-template-columns:1fr}
  .chart-row-mobile{grid-template-columns:1fr}
  .tarifa-row{grid-template-columns:1fr 110px}
  .tarifa-year{display:none}
  .h-actions .btn-danger{display:none}
  /* Prevent overflow in cards */
  .card{overflow:hidden;max-width:100%}
  .tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
  /* Chart must not overflow */
  .chart-wrap{overflow:hidden;padding:12px}
  .chart-wrap svg{max-width:100%}
  /* Period selector wrap */
  .period-row{flex-wrap:wrap;gap:8px}
  /* Mono font scale down */
  .mono-cell,.kpi-value{letter-spacing:-.01em}
}
@media(max-width:380px){
  .kpi-value{font-size:15px !important}
  .kpi.primary .kpi-value{font-size:17px !important}
  .kpi{padding:10px 10px}
  td,th{padding:6px 6px;font-size:10px}
  .page{padding:8px}
}
@media(max-width:1280px){
  .kpis{grid-template-columns:1.4fr 1fr 1fr 1fr 1fr 1fr}
  .kpi-value{font-size:22px}
  .kpi.primary .kpi-value{font-size:24px}
}

const SB_URL='https://ybztenzmpwufcvzvmwao.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InlienRlbnptcHd1ZmN2enZtd2FvIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY5MzM0NzYsImV4cCI6MjA5MjUwOTQ3Nn0.bHC65JMkp6LSd9qWEVgZyhwtLlnOYzVjuEHV46LfVag';
const sb=supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});

const MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const PREV_LIST=['Fonasa','Colmena','Cruz Blanca','Particular','Particular Acuerdo'];
const ESTADOS=['','Cobrado','Pagado','Pendiente'];
const CUR_YEAR=new Date().getFullYear();
const IMPUESTO=0.1525;
const PIE_COLORS=['#1b3f6e','#1a7a5a','#b86000','#1a5fa8','#7c3aed'];

let pts={},view='dashboard',pid=null,sbOpen=false,showAlta=false;
let curFontSize='normal';
let sortCol='fecha',sortDir=1;
let tarifas={};
let costoConsulta=60000;
let curTheme='blue';
let privateMode=false;
let inactiveWeeks=6;
let resumenSortCol='nombre',resumenSortDir=1;
let resumenPeriod='anual';
let yearFilter=String(CUR_YEAR);

// ── LOGIN ─────────────────────────────────────────────
async function checkSession(){
  const{data:{session}}=await sb.auth.getSession();
  if(session)showApp();
  else document.getElementById('login-screen').style.display='flex';
}
async function doLogin(){
  const email=document.getElementById('login-email').value.trim();
  const pw=document.getElementById('login-pw').value;
  const btn=document.getElementById('login-btn');
  const err=document.getElementById('login-error');
  if(!email||!pw){showErr('Ingresa tu correo y contraseña');return;}
  btn.disabled=true;btn.innerHTML='<span class="login-spinner"></span>Ingresando\u2026';
  err.classList.remove('show');
  const{error}=await sb.auth.signInWithPassword({email,password:pw});
  if(error){showErr('Correo o contraseña incorrectos');btn.disabled=false;btn.innerHTML='Ingresar';}
  else showApp();
}
function showErr(msg){const el=document.getElementById('login-error');el.textContent=msg;el.classList.add('show');}
function showApp(){
  document.getElementById('login-screen').style.display='none';
  document.getElementById('main-app').style.display='flex';
  loadTheme();loadLocal();
  document.getElementById('year-label').textContent=CUR_YEAR;
  loadData();
  initKeyboard();
}
async function doLogout(){await sb.auth.signOut();location.reload();}

// ── THEME & LOCAL ─────────────────────────────────────
function applyTheme(t){
  curTheme=t;document.documentElement.setAttribute('data-theme',t==='blue'?'':t);
  localStorage.setItem('cp_theme',t);
  const mc=document.getElementById('theme-color-meta');
  if(mc){const m={blue:'#f5f7fa',green:'#f0f9f4',dark:'#0a0a14'};mc.content=m[t]||'#f5f7fa';}
}
function loadTheme(){applyTheme(localStorage.getItem('cp_theme')||'blue');}
function applyFontSize(s){
  curFontSize=s;
  const m={
    normal: ['14px','20px','12px','11px','13px','10px'],
    medium: ['16px','23px','14px','12px','15px','11px'],
    large:  ['18px','26px','16px','14px','17px','12px'],
    xlarge: ['20px','30px','18px','16px','19px','14px']
  };
  const v=m[s]||m.normal;
  const r=document.documentElement;
  r.style.setProperty('--fs-base',v[0]);  // body text
  r.style.setProperty('--fs-xl',v[1]);    // metric values
  r.style.setProperty('--fs-sm',v[2]);    // small text
  r.style.setProperty('--fs-xs',v[3]);    // extra small
  r.style.setProperty('--fs-sb',v[4]);    // sidebar items
  r.style.setProperty('--fs-sblbl',v[5]); // sidebar labels
  localStorage.setItem('cp_fontsize',s);
  if(view==='config')renderConfig();
}
function loadLocal(){
  try{const s=localStorage.getItem('cp_tarifas');if(s)tarifas=JSON.parse(s);}catch(e){}
  try{const c=localStorage.getItem('cp_costo');if(c)costoConsulta=parseInt(c)||60000;}catch(e){}
  try{const w=localStorage.getItem('cp_weeks');if(w)inactiveWeeks=parseInt(w)||6;}catch(e){}
  try{const f=localStorage.getItem('cp_fontsize');if(f){curFontSize=f;applyFontSize(f);}}catch(e){}
}
function saveTarifasLocal(){localStorage.setItem('cp_tarifas',JSON.stringify(tarifas));}
function saveCosto(val){costoConsulta=parseInt(val)||60000;localStorage.setItem('cp_costo',String(costoConsulta));}
function saveWeeks(val){inactiveWeeks=parseInt(val)||6;localStorage.setItem('cp_weeks',String(inactiveWeeks));}
function getTarifa(prev){const yr=String(CUR_YEAR);return tarifas[prev]?.[yr]||tarifas[prev]?.[String(CUR_YEAR-1)]||0;}
function saveTarifa(prev,yr,val){if(!tarifas[prev])tarifas[prev]={};tarifas[prev][yr]=parseInt(val)||0;saveTarifasLocal();}

// ── PRIVATE MODE ─────────────────────────────────────
function togglePrivate(){
  privateMode=!privateMode;
  document.getElementById('private-btn').textContent=privateMode?'\uD83D\uDE48':'\uD83D\uDC41';
  if(view==='dashboard')renderDashboard();
  else if(view==='resumen')renderResumen();
  else if(view==='patient'&&pid)renderPatient(pid);
}
function pv(val){
  if(privateMode)return`<span class="private-val">$••••••</span>`;
  return val;
}

// ── SYNC ──────────────────────────────────────────────
function sync(state,txt){
  const el=document.getElementById('sync-pill');if(!el)return;
  el.className='sync-pill '+state;
  el.textContent={ok:'\u2713 Sync',saving:'Guardando\u2026',error:'Sin conexión'}[state]||txt||'\u2026';
}
function toggleSb(){sbOpen=!sbOpen;document.getElementById('sidebar').classList.toggle('open',sbOpen);document.getElementById('sb-overlay').classList.toggle('visible',sbOpen);}
function closeSb(){sbOpen=false;document.getElementById('sidebar').classList.remove('open');document.getElementById('sb-overlay').classList.remove('visible');}
function fmt(n){return Math.round(n).toLocaleString('es-CL');}
function esc(s){return String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
function badge(estado){
  if(!estado)return'<span class="badge b-empty">Sin estado</span>';
  const m={Cobrado:'b-cobrado',Pagado:'b-pagado',Pendiente:'b-pendiente'};
  return`<span class="badge ${m[estado]||'b-empty'}">${estado}</span>`;
}
function allSessions(){let a=[];Object.values(pts).forEach(p=>p.ses.forEach(s=>a.push({...s,paciente:p.nombre})));return a;}
function modalBadge(modalidad){
  const isOnline=modalidad==='En l\u00EDnea';
  const color=isOnline?'#1a7a5a':'#b86000';
  return`<span style="color:${color};font-size:12px"><span style="display:inline-block;width:8px;height:8px;border-radius:50%;background:${color};margin-right:5px;vertical-align:middle"></span>${modalidad||'Presencial'}</span>`;
}

// ── LOAD DATA ─────────────────────────────────────────
async function loadData(){
  sync('saving','Cargando\u2026');
  try{
    const{data:pats,error:e1}=await sb.from('pacientes').select('*').order('nombre');
    if(e1)throw e1;
    const{data:sess,error:e2}=await sb.from('sesiones').select('*').order('created_at');
    if(e2)throw e2;
    pts={};
    pats.forEach(p=>{pts[p.id]={id:p.id,nombre:p.nombre,prevision:p.prevision,alta:p.alta||false,modalidad:p.modalidad||'Presencial',nextSession:p.next_session||null,inactiveWeeks:p.inactive_weeks||null,confirmacion:p.confirmacion||null,telefono:p.telefono||null,ses:[]};});
    sess.forEach(s=>{if(pts[s.paciente_id])pts[s.paciente_id].ses.push(s);});
    sync('ok');renderNav();renderDashboard();
  }catch(e){
    sync('error');
    document.getElementById('main-body').innerHTML='<div class="empty"><div class="ei">\u26A0\uFE0F</div><p>Error al conectar.<br>Verifica tu conexión.</p></div>';
  }
}

// ── KEYBOARD SHORTCUTS ────────────────────────────────
function initKeyboard(){
  document.addEventListener('keydown',e=>{
    if(e.target.tagName==='INPUT'||e.target.tagName==='TEXTAREA'||e.target.tagName==='SELECT')return;
    if(e.metaKey||e.ctrlKey){
      switch(e.key){
        case 'n':e.preventDefault();showAddPatient();break;
        case 'b':e.preventDefault();if(pid)showAddSes(pid);break;
        case 'f':e.preventDefault();openSearch();break;
        case 'd':e.preventDefault();showView('dashboard');break;
        case 'r':e.preventDefault();showView('resumen');break;
        case 'p':e.preventDefault();togglePrivate();break;
      }
    }
  });
}

// ── SEARCH ────────────────────────────────────────────
function openSearch(){
  document.getElementById('search-root').innerHTML=`<div class="search-overlay" onclick="if(event.target===this)closeSearch()">
    <div class="search-box">
      <div class="search-input-wrap">
        <span style="color:var(--text3);font-size:18px"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5l3 3"/></svg></span>
        <input type="text" id="global-search" placeholder="Buscar pacientes, observaciones, previsiones\u2026" oninput="doSearch()" autofocus>
        <button class="btn btn-sm" onclick="closeSearch()">\u2715</button>
      </div>
      <div class="search-results" id="search-results"><div class="search-empty">Escribe para buscar\u2026</div></div>
    </div>
  </div>`;
  setTimeout(()=>document.getElementById('global-search')?.focus(),100);
}
function closeSearch(){document.getElementById('search-root').innerHTML='';}
function doSearch(){
  const q=document.getElementById('global-search')?.value?.toLowerCase()||'';
  const res=document.getElementById('search-results');
  if(!q){res.innerHTML='<div class="search-empty">Escribe para buscar\u2026</div>';return;}
  const patMatches=Object.values(pts).filter(p=>p.nombre.toLowerCase().includes(q)||p.prevision?.toLowerCase().includes(q)||p.modalidad?.toLowerCase().includes(q));
  const sesMatches=[];
  Object.values(pts).forEach(p=>{
    p.ses.forEach(s=>{
      if(s.observaciones&&s.observaciones.toLowerCase().includes(q))sesMatches.push({...s,paciente:p.nombre,pid:p.id});
    });
  });
  let html='';
  if(patMatches.length){
    html+=`<div class="search-group"><div class="search-group-title">Pacientes (${patMatches.length})</div>`;
    html+=patMatches.map(p=>`<div class="search-item" onclick="closeSearch();showPatient('${esc(p.id)}')">
      <span style="font-size:16px">${p.modalidad==='En l\u00EDnea'?'\uD83D\uDCBB':'\uD83C\uDFE2'}</span>
      <div class="search-item-name">${p.nombre}</div>
      <div class="search-item-detail">${p.prevision||'—'} · ${p.ses.length} ses.</div>
    </div>`).join('');
    html+='</div>';
  }
  if(sesMatches.length){
    html+=`<div class="search-group"><div class="search-group-title">Observaciones (${sesMatches.length})</div>`;
    html+=sesMatches.slice(0,8).map(s=>`<div class="search-item" onclick="closeSearch();showPatient('${esc(s.pid)}')">
      <span style="color:var(--ink-3)">💬</span>
      <div><div class="search-item-name">${s.paciente}</div><div class="search-item-detail" style="margin-top:2px">${s.observaciones?.slice(0,60)}\u2026</div></div>
    </div>`).join('');
    html+='</div>';
  }
  if(!patMatches.length&&!sesMatches.length)html='<div class="search-empty">Sin resultados para "'+q+'"</div>';
  res.innerHTML=html;
}

function renderNav(){
  const q=(document.getElementById('search-input')?.value||'').toLowerCase();
  let list=Object.values(pts).filter(p=>p.nombre.toLowerCase().includes(q));
  if(!showAlta)list=list.filter(p=>!p.alta);
  list.sort((a,b)=>a.nombre.localeCompare(b.nombre));

    ?list.map(p=>{

      return`<button class="nb ${view==='patient'&&pid===p.id?'active':''} ${p.alta?'alta':''}" onclick="showPatient('${esc(p.id)}')">${hasAlert?'🔴 ':''} ${p.alta?'\u2713 ':''} ${p.nombre}</button>`;

function showView(v){
  view=v;pid=null;
  document.querySelectorAll('.nb').forEach(e=>e.classList.remove('active'));
  document.getElementById('nav-'+v)?.classList.add('active');
  renderNav();closeSb();

}

  renderNav();closeSb();renderPatient(id);
}

// ── HELPERS ───────────────────────────────────────────
function getLastSession(p){
  if(!p.ses.length)return null;
  return p.ses.reduce((a,b)=>{
    const da=a.fecha?a.fecha.split('/').reverse().join(''):'';
    const db=b.fecha?b.fecha.split('/').reverse().join(''):'';
    return da>db?a:b;
  });
}
function weeksAgo(fechaStr){
  if(!fechaStr)return 999;
  const parts=fechaStr.split('/');
  if(parts.length<3)return 999;
  const d=new Date(parseInt(parts[2]),parseInt(parts[1])-1,parseInt(parts[0]));
  return Math.floor((Date.now()-d.getTime())/(7*24*3600*1000));
}

function renderDashboard(){

  document.getElementById('header-actions').innerHTML=`

    <button class="btn btn-icon" onclick="openSearch()" title="Búsqueda global (Cmd+F)"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5l3 3"/></svg></button>`;

  const all=allSessions();
  const curYearSes=all.filter(s=>s.fecha&&s.fecha.split('/')[2]===String(CUR_YEAR));
  const total=curYearSes.reduce((a,s)=>a+s.monto,0);
  const cobrado=curYearSes.filter(s=>s.estado==='Cobrado').reduce((a,s)=>a+s.monto,0);

  const monSet=new Set(curYearSes.map(s=>s.mes));
  const nMeses=monSet.size;
  const impD=Math.round(total*IMPUESTO);
  const costoD=costoConsulta*nMeses;
  const liquido=total-impD-costoD;
  const pActivos=Object.values(pts).filter(p=>!p.alta);
  const avgSes=pActivos.length?Math.round((pActivos.reduce((a,p)=>a+p.ses.length,0)/pActivos.length)*10)/10:0;
  const nActivos=pActivos.length;
  const nAlta=Object.values(pts).filter(p=>p.alta).length;

  // ── KPI strip (6 cells, using static .kpis / .kpi classes) ─────────────
  const prevYearSes=all.filter(s=>s.fecha&&s.fecha.split('/')[2]===String(CUR_YEAR-1));
  const prevTotal=prevYearSes.reduce((a,s)=>a+s.monto,0);

  const deltaCls=deltaTotal===null?'flat':deltaTotal>0?'':'down';
  const deltaTxt=deltaTotal===null?'—':(deltaTotal>0?'+':'')+deltaTotal+'%';

  const kpisHtml=`
  <div class="kpis">
    <div class="kpi primary" style="position:relative">
      <div class="kpi-label">Total facturado ${CUR_YEAR}</div>
      <div class="kpi-value">${pv('$'+fmt(total))}</div>
      <div class="kpi-sub">
        <span class="delta ${deltaCls}">${deltaTxt} vs ${CUR_YEAR-1}</span>
        ${curYearSes.length} ses · ${nActivos} activos${nAlta?' · '+nAlta+' alta':''}
      </div>
      <svg class="spark" viewBox="0 0 80 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><polyline points="2,18 14,16 26,14 38,11 50,12 62,8 74,5"/></svg>
    </div>
    <div class="kpi">
      <div class="kpi-label">Cobrado</div>
      <div class="kpi-value pos">${pv('$'+fmt(cobrado))}</div>
      <div class="kpi-sub">${curYearSes.filter(s=>s.estado==='Cobrado').length} sesiones</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Pagado previsión</div>
      <div class="kpi-value acc">${pv('$'+fmt(pagado))}</div>
      <div class="kpi-sub">${curYearSes.filter(s=>s.estado==='Pagado').length} sesiones</div>
    </div>
    <div class="kpi">
      <div class="kpi-label">Pendiente</div>
      <div class="kpi-value neg">${pv('$'+fmt(pendiente))}</div>
      <div class="kpi-sub">${curYearSes.filter(s=>s.estado==='Pendiente').length} sesiones</div>
    </div>
    <div class="kpi" style="position:relative">
      <div class="kpi-label">Líquido a percibir</div>
      <div class="kpi-value">${pv('$'+fmt(liquido))}</div>
      <div class="kpi-sub">−imp. −consulta</div>
      <svg class="spark" viewBox="0 0 80 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><polyline points="2,20 14,18 26,16 38,14 50,12 62,10 74,7"/></svg>
    </div>
    <div class="kpi">
      <div class="kpi-label">Promedio ses./paciente</div>
      <div class="kpi-value">${avgSes}</div>
      <div class="kpi-sub">${nActivos} pacientes activos</div>
    </div>
  </div>`;

  // ── SVG bar chart by month (using static .card structure) ───────────────
  const monMap={};
  curYearSes.forEach(s=>{
    const mesIdx=MESES.indexOf(s.mes);if(mesIdx<0)return;
    const key=String(mesIdx+1).padStart(2,'0');
    if(!monMap[key])monMap[key]={label:MESES[mesIdx].slice(0,3)+"'" +String(CUR_YEAR).slice(2),total:0,cobrado:0};
    monMap[key].total+=s.monto;
    if(s.estado==='Cobrado')monMap[key].cobrado+=s.monto;
  });
  Object.keys(monMap).forEach(k=>{
    monMap[k].liquido=Math.max(monMap[k].total-Math.round(monMap[k].total*IMPUESTO)-costoConsulta,0);
  });
  const sortedMKeys=Object.keys(monMap).sort();
  const maxV=Math.max(...sortedMKeys.map(k=>monMap[k].total),1);
  const avgV=sortedMKeys.length?sortedMKeys.reduce((a,k)=>a+monMap[k].total,0)/sortedMKeys.length:0;
  const nB=sortedMKeys.length||1;
  const W=640,H=200,PL=44,PB=28,PT=16;
  const iW=W-PL-8,iH=H-PB-PT;
  const xStep=iW/nB;
  const bW=Math.min(Math.floor(xStep*0.55),72);
  // Y grid
  const yGrid=[0,0.25,0.5,0.75,1].map(f=>{
    const y=H-PB-f*iH;
    const v=Math.round(maxV*f/1000);
    return`<line x1="${PL}" y1="${y.toFixed(1)}" x2="${W}" y2="${y.toFixed(1)}" stroke="var(--rule)" stroke-width="1"/>
<text x="${PL-4}" y="${(y+3.5).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--ink-4)">${v>0?'$'+v+'k':''}</text>`;
  }).join('');
  // avg dashed line
  const avgY=H-PB-(avgV/maxV)*iH;
  const avgLine=avgV>0?`<line x1="${PL}" y1="${avgY.toFixed(1)}" x2="${W}" y2="${avgY.toFixed(1)}" stroke="var(--ink-3)" stroke-dasharray="3 4" stroke-width="1.1" opacity=".5"/>
<text x="${W-2}" y="${(avgY-4).toFixed(1)}" text-anchor="end" font-size="9" fill="var(--ink-3)" opacity=".7">prom $${Math.round(avgV/1000)}k</text>`:'';
  // Active chart determines which value drives bar height + label
  const chartVal=(m)=>activeChart==='cobrado'?m.cobrado:activeChart==='liquido'?m.liquido:m.total;
  const maxVActive=Math.max(...sortedMKeys.map(k=>chartVal(monMap[k])),1);
  const barFill=activeChart==='cobrado'?'oklch(0.62 0.13 165)':activeChart==='liquido'?'oklch(0.55 0.18 255)':'oklch(0.40 0.16 265)';
  const bars=sortedMKeys.map((k,i)=>{
    const m=monMap[k];
    const v=chartVal(m);
    const cx=PL+i*xStep+xStep/2;
    const bx=cx-bW/2;
    const hV=Math.max((v/maxVActive)*iH,v>0?2:0);
    const yV=H-PB-hV;
    const lbl=privateMode?'':`<text x="${cx.toFixed(1)}" y="${(yV-4).toFixed(1)}" text-anchor="middle" font-size="9" fill="var(--ink-3)">$${Math.round(v/1000)}k</text>`;
    return`<g>
  <rect x="${bx.toFixed(1)}" y="${yV.toFixed(1)}" width="${bW}" height="${hV.toFixed(1)}" fill="${barFill}" rx="3" opacity=".85"/>

  <text x="${cx.toFixed(1)}" y="${H-PB+14}" text-anchor="middle" font-size="10" fill="var(--ink-4)">${m.label}</text>
</g>`;
  }).join('');
  const chartSvg=sortedMKeys.length
    ?`<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${yGrid}${avgLine}${bars}</svg>`

  // ── Alerts (right column) ────────────────────────────────────────────────

  }).sort((a,b)=>a.nextSession.split('/').reverse().join('').localeCompare(b.nextSession.split('/').reverse().join('')));

  let alertRows='';
  pendingAlerts.forEach(p=>{
    const n=p.ses.filter(s=>s.estado==='Pendiente').length;

    return`<tr>

      <td><span class="status-dot ${dot}"></span>${pend>0?'Pendiente':'Al día'}</td>
      <td class="amt">${pv('$'+fmt(getTarifa(p.prevision)||0))}</td>

  // ── Compose ──────────────────────────────────────────────────────────────
  const now=new Date();
  const fechaStr=now.toLocaleDateString('es-CL',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'});

  </div>
</div>

${kpisHtml}

<div class="grid">
  <div style="display:flex;flex-direction:column;gap:18px">
    <div class="card">
      <div class="card-head">
        <h3>Ingresos por mes</h3>

function buildMesTab(all,yr){
  const yrSes=all.filter(s=>s.fecha&&s.fecha.split('/')[2]===yr);

  // Group by period
  function getPeriodKey(s){
    const mesIdx=MESES.indexOf(s.mes);
    if(resumenPeriod==='trimestral'){
      const q=Math.floor(mesIdx/3)+1;
      return{key:`Q${q}`,label:`T${q} ${yr}`};
    } else if(resumenPeriod==='semestral'){
      const h=mesIdx<6?1:2;
      return{key:`H${h}`,label:`${h}er Sem. ${yr}`};
    }
    return{key:String(mesIdx+1).padStart(2,'0'),label:s.mes[0].toUpperCase()+s.mes.slice(1)+' '+yr};
  }

  const monMap={};
  yrSes.forEach(s=>{
    const mesIdx=MESES.indexOf(s.mes);if(mesIdx<0)return;
    const{key,label}=getPeriodKey(s);
    if(!monMap[key])monMap[key]={label,ses:[],total:0,cob:0,pag:0,pen:0,liquido:0};
    monMap[key].ses.push(s);monMap[key].total+=s.monto;
    if(s.estado==='Cobrado')monMap[key].cob+=s.monto;
    else if(s.estado==='Pagado')monMap[key].pag+=s.monto;
    else if(s.estado==='Pendiente')monMap[key].pen+=s.monto;
  });

  // Compute liquido per period
  const nPeriodsTotal=Object.keys(monMap).length;
  Object.values(monMap).forEach(d=>{
    const nMesesInPeriod=resumenPeriod==='trimestral'?3:resumenPeriod==='semestral'?6:1;
    const imp=Math.round(d.total*IMPUESTO);
    const costo=costoConsulta*nMesesInPeriod;
    d.liquido=d.total-imp-costo;
    d.imp=imp;d.costo=costo;
  });

  const total=yrSes.reduce((a,s)=>a+s.monto,0);
  const cob=yrSes.filter(s=>s.estado==='Cobrado').reduce((a,s)=>a+s.monto,0);
  const pag=yrSes.filter(s=>s.estado==='Pagado').reduce((a,s)=>a+s.monto,0);
  const pen=yrSes.filter(s=>s.estado==='Pendiente').reduce((a,s)=>a+s.monto,0);
  const nMTot=resumenPeriod==='trimestral'?4:resumenPeriod==='semestral'?2:nPeriodsTotal;
  const totalImp=Math.round(total*IMPUESTO);
  const totalCosto=costoConsulta*(resumenPeriod==='trimestral'?12:resumenPeriod==='semestral'?12:nPeriodsTotal);
  const totalLiq=total-totalImp-totalCosto;

  const rows=Object.keys(monMap).sort().map(k=>{
    const d=monMap[k];
    const liq=d.liquido;
    return`<tr>
      <td style="font-weight:500">${d.label}</td>
      <td style="text-align:center;color:var(--ink-3)">${d.ses.length}</td>
      <td style="text-align:right;font-family:var(--mono)">${pv('$'+fmt(d.total))}</td>
      <td style="text-align:right;font-family:var(--mono);color:var(--pos)">${pv('$'+fmt(d.cob))}</td>
      <td style="text-align:right;font-family:var(--mono);color:var(--accent)">${pv('$'+fmt(d.pag))}</td>
      <td style="text-align:right;font-family:var(--mono);color:var(--neg)">${pv('$'+fmt(d.pen))}</td>
      <td style="text-align:right;font-family:var(--mono);color:var(--warn);font-size:11px">${pv('-$'+fmt(d.imp))}</td>
      <td style="text-align:right;font-family:var(--mono);color:var(--ink-3);font-size:11px">${pv('-$'+fmt(d.costo))}</td>
      <td style="text-align:right;font-family:var(--mono);font-weight:600;color:${liq>=0?'var(--accent)':'var(--neg)'}">${pv('$'+fmt(liq))}</td>
    </tr>`;
  }).join('');

  const periodLabel=resumenPeriod==='trimestral'?'Trimestres':resumenPeriod==='semestral'?'Semestres':'Meses';
  return`<div class="card" style="overflow:hidden"><table>
    <thead><tr>
      <th>${periodLabel}</th>
      <th style="text-align:center">Ses.</th>
      <th style="text-align:right">Total</th>
      <th style="text-align:right;color:var(--pos)">Cobrado</th>
      <th style="text-align:right;color:var(--accent)">Pagado</th>
      <th style="text-align:right;color:var(--neg)">Pendiente</th>
      <th style="text-align:right;color:var(--warn)">Impuesto</th>
      <th style="text-align:right;color:var(--ink-3)">Consulta</th>
      <th style="text-align:right;color:var(--accent)">Líquido</th>
    </tr></thead>
    <tbody>${rows}
    <tr style="background:var(--rule-2);font-weight:600;border-top:2px solid var(--rule)">
      <td>Total ${yr}</td>
      <td style="text-align:center;color:var(--ink-3)">${yrSes.length}</td>
      <td style="text-align:right;font-family:var(--mono)">${pv('$'+fmt(total))}</td>
      <td style="text-align:right;font-family:var(--mono);color:var(--pos)">${pv('$'+fmt(cob))}</td>
      <td style="text-align:right;font-family:var(--mono);color:var(--accent)">${pv('$'+fmt(pag))}</td>
      <td style="text-align:right;font-family:var(--mono);color:var(--neg)">${pv('$'+fmt(pen))}</td>
      <td style="text-align:right;font-family:var(--mono);color:var(--warn)">${pv('-$'+fmt(totalImp))}</td>
      <td style="text-align:right;font-family:var(--mono);color:var(--ink-3)">${pv('-$'+fmt(totalCosto))}</td>
      <td style="text-align:right;font-family:var(--mono);font-weight:700;color:${totalLiq>=0?'var(--accent)':'var(--neg)'}">${pv('$'+fmt(totalLiq))}</td>
    </tr></tbody>
  </table></div>`;
}

  return`<div class="tw"><table><thead><tr>

    <th>Modalidad</th><th>Previsión</th>

    <th style="color:var(--blue)">Pagado</th>
  </tr></thead><tbody>${rows}</tbody></table></div>`;
}

function buildComparativa(all,yr,prevYr){
  const getMonthData=(year)=>{
    const map={};
    all.filter(s=>s.fecha&&s.fecha.split('/')[2]===year).forEach(s=>{
      const i=MESES.indexOf(s.mes);if(i<0)return;
      const k=String(i+1).padStart(2,'0');
      map[k]=(map[k]||0)+s.monto;
    });
    return map;
  };
  const curData=getMonthData(yr);
  const prevData=getMonthData(prevYr);
  const allKeys=[...new Set([...Object.keys(curData),...Object.keys(prevData)])].sort();
  const maxV=Math.max(...allKeys.map(k=>Math.max(curData[k]||0,prevData[k]||0)),1);

  const bars=allKeys.map(k=>{
    const c=curData[k]||0;const p=prevData[k]||0;
    const hc=Math.max(Math.round((c/maxV)*80),c>0?2:0);
    const hp=Math.max(Math.round((p/maxV)*80),p>0?2:0);
    const label=MESES[parseInt(k)-1].slice(0,3);
    return`<div class="bc2" style="gap:2px">
      <div class="bbar" style="height:${hc}px;background:var(--sb)"></div>
      <div class="bbar2" style="height:${hp}px"></div>
      <div class="blbl">${label}</div>
    </div>`;
  }).join('');

  const rows=allKeys.map(k=>{
    const c=curData[k]||0;const p=prevData[k]||0;
    const diff=c-p;const pct=p>0?Math.round((diff/p)*100):null;
    const col=diff>=0?'var(--green)':'var(--red)';
    const arrow=diff>=0?'↑':'↓';
    return`<tr><td style="font-weight:500">${MESES[parseInt(k)-1][0].toUpperCase()+MESES[parseInt(k)-1].slice(1)}</td>
      <td style="font-family:var(--mono)">${pv('$'+fmt(c))}</td>
      <td style="font-family:var(--mono);color:var(--text3)">${p>0?pv('$'+fmt(p)):'—'}</td>
      <td style="font-family:var(--mono);color:${col};font-weight:600">${diff!==0?arrow+' '+pv('$'+fmt(Math.abs(diff))):'—'}</td>
      <td style="color:${col};font-weight:600">${pct!==null?pct+'%':'—'}</td>
    </tr>`;
  }).join('');

  const totCur=Object.values(curData).reduce((a,v)=>a+v,0);
  const totPrev=Object.values(prevData).reduce((a,v)=>a+v,0);
  const totDiff=totCur-totPrev;
  const totPct=totPrev>0?Math.round((totDiff/totPrev)*100):null;
  const totCol=totDiff>=0?'var(--green)':'var(--red)';

  return`<div style="margin-bottom:16px">
    <div style="display:flex;align-items:center;gap:16px;margin-bottom:8px">
      <div style="display:flex;align-items:center;gap:6px;font-size:12px"><div style="width:12px;height:12px;background:var(--sb);border-radius:2px"></div>${yr}</div>
      <div style="display:flex;align-items:center;gap:6px;font-size:12px"><div style="width:12px;height:12px;background:var(--green-bg);border:1px solid var(--green);border-radius:2px"></div>${prevYr}</div>
    </div>
    <div class="chart" style="height:90px">${bars}</div>
  </div>
  <div class="tw"><table><thead><tr><th>Mes</th><th>${yr}</th><th>${prevYr}</th><th>Diferencia</th><th>Variación</th></tr></thead>
  <tbody>${rows}<tr style="background:var(--surface2);font-weight:600;border-top:2px solid var(--border2)">
    <td>Total</td><td style="font-family:var(--mono)">${pv('$'+fmt(totCur))}</td><td style="font-family:var(--mono);color:var(--text3)">${pv('$'+fmt(totPrev))}</td>
    <td style="font-family:var(--mono);color:${totCol}">${totDiff!==0?(totDiff>0?'↑':'↓')+' '+pv('$'+fmt(Math.abs(totDiff))):'—'}</td>
    <td style="color:${totCol}">${totPct!==null?totPct+'%':'—'}</td>
  </tr></tbody></table></div>`;
}

function buildPrevTab(all,yr,prevYr){
  const getData=(year)=>{
    const map={};
    all.filter(s=>s.fecha&&s.fecha.split('/')[2]===year).forEach(s=>{
      map[s.prevision]=(map[s.prevision]||0)+s.monto;
    });
    return map;
  };
  const curData=getData(yr);const prevData=getData(prevYr);
  const prevs=[...new Set([...Object.keys(curData),...Object.keys(prevData)])];
  const rows=prevs.map(p=>{
    const c=curData[p]||0;const prev=prevData[p]||0;
    const diff=c-prev;const pct=prev>0?Math.round((diff/prev)*100):null;
    const col=diff>=0?'var(--green)':'var(--red)';
    return`<tr><td style="font-weight:500">${p}</td><td style="font-family:var(--mono)">${pv('$'+fmt(c))}</td><td style="font-family:var(--mono);color:var(--text3)">${prev>0?pv('$'+fmt(prev)):'—'}</td><td style="color:${col};font-weight:600">${pct!==null?pct+'%':'—'}</td></tr>`;
  }).join('');
  return`<div class="tw"><table><thead><tr><th>Previsión</th><th>${yr}</th><th>${prevYr}</th><th>Variación</th></tr></thead><tbody>${rows}</tbody></table></div>`;
}

function switchTabById(id){
  document.querySelectorAll('.tab').forEach((t,i)=>{
    const ids=['tm','tp','tc','tprev'];
    t.classList.toggle('active',ids[i]===id);
  });
  ['tm','tp','tc','tprev'].forEach(t=>{const el=document.getElementById(t);if(el)el.style.display=t===id?'':'none';});
}

function renderPatient(id){
  const p=pts[id];if(!p)return;
  document.getElementById('view-title').textContent=p.nombre;
  const altaBtn=p.alta
    ?`<button class="btn btn-success btn-sm" onclick="toggleAlta('${esc(id)}',false)">↩ Reactivar</button>`
    :`<button class="btn btn-warning btn-sm" onclick="toggleAlta('${esc(id)}',true)">\u2713 Dar de alta</button>`;
  document.getElementById('header-actions').innerHTML=`
    <button class="btn btn-icon" id="private-btn" onclick="togglePrivate()">${privateMode?`<svg width='15' height='15' viewBox='0 0 16 16' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z'/><circle cx='8' cy='8' r='2'/><line x1='2' y1='2' x2='14' y2='14'/></svg>`:`<svg width='15' height='15' viewBox='0 0 16 16' fill='none' stroke='currentColor' stroke-width='1.4'><path d='M1 8s2.5-5 7-5 7 5 7 5-2.5 5-7 5-7-5-7-5z'/><circle cx='8' cy='8' r='2'/></svg>`}</button>
    <button class="btn btn-icon" onclick="openSearch()"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5l3 3"/></svg></button>
    <button class="btn btn-primary btn-sm" onclick="showAddSes('${esc(id)}')">+ Sesión</button>
    ${altaBtn}
    <button class="btn btn-danger btn-sm" onclick="delPatient('${esc(id)}')">Eliminar</button>`;

  const total=p.ses.reduce((a,s)=>a+s.monto,0);
  const cob=p.ses.filter(s=>s.estado==='Cobrado').reduce((a,s)=>a+s.monto,0);
  const pag=p.ses.filter(s=>s.estado==='Pagado').reduce((a,s)=>a+s.monto,0);
  const pen=p.ses.filter(s=>s.estado==='Pendiente').length;

  const sorted=[...p.ses].sort((a,b)=>{
    let va,vb;
    if(sortCol==='fecha'){va=a.fecha?a.fecha.split('/').reverse().join(''):'';vb=b.fecha?b.fecha.split('/').reverse().join(''):'';}
    else if(sortCol==='mes'){va=MESES.indexOf(a.mes);vb=MESES.indexOf(b.mes);}
    else if(sortCol==='estado'){const o={Cobrado:1,Pagado:2,Pendiente:3,'':4};va=o[a.estado]||4;vb=o[b.estado]||4;}
    else{va=a.fecha?a.fecha.split('/').reverse().join(''):'';vb=b.fecha?b.fecha.split('/').reverse().join(''):'';}
    if(va<vb)return -sortDir;if(va>vb)return sortDir;return 0;
  });

  function si(col){return sortCol===col?(sortDir===1?'↑':'↓'):'↕';}

  const rows=sorted.map((s,i)=>{
    const hasObs=s.observaciones&&s.observaciones.trim();

async function setNextSession(id,opt){
  const today=new Date();
  let d=new Date(today);
  if(opt==='1 semana')d.setDate(today.getDate()+7);
  else if(opt==='15 días')d.setDate(today.getDate()+15);
  else if(opt==='1 mes')d.setMonth(today.getMonth()+1);
  const dd=String(d.getDate()).padStart(2,'0');
  const mm=String(d.getMonth()+1).padStart(2,'0');
  const fecha=`${dd}/${mm}/${d.getFullYear()}`;
  sync('saving');
  const{error}=await sb.from('pacientes').update({next_session:fecha}).eq('id',id);
  if(error){sync('error');return;}
  pts[id].nextSession=fecha;sync('ok');renderPatient(id);
}
async function clearNextSession(id){
  sync('saving');
  const{error}=await sb.from('pacientes').update({next_session:null}).eq('id',id);
  if(error){sync('error');return;}
  pts[id].nextSession=null;sync('ok');renderPatient(id);
}
async function savePatientWeeks(id,val){
  const w=parseInt(val)||null;
  pts[id].inactiveWeeks=w;
  await sb.from('pacientes').update({inactive_weeks:w}).eq('id',id);
}
async function toggleAlta(id,alta){
  const p=pts[id];
  if(!confirm(`¿${alta?'Dar de alta':'Reactivar'} a ${p?.nombre}?`))return;
  sync('saving');
  const{error}=await sb.from('pacientes').update({alta}).eq('id',id);
  if(error){sync('error');return;}
  pts[id].alta=alta;sync('ok');renderNav();renderPatient(id);
}
async function toggleModalidad(id){
  const p=pts[id];
  const nueva=p.modalidad==='En l\u00EDnea'?'Presencial':'En l\u00EDnea';
  sync('saving');
  const{error}=await sb.from('pacientes').update({modalidad:nueva}).eq('id',id);
  if(error){sync('error');return;}
  pts[id].modalidad=nueva;sync('ok');renderPatient(id);
}
function sortSessions(col){if(sortCol===col)sortDir*=-1;else{sortCol=col;sortDir=1;}renderPatient(pid);}
