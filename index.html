async function addPatient(){
  const nombre=document.getElementById('np-n').value.trim();
  const prevision=document.getElementById('np-p').value;
  const modalidad=document.getElementById('np-m').value;
  if(!nombre){alert('Ingresa el nombre');return;}
  if(Object.values(pts).find(p=>p.nombre===nombre)){alert('Ya existe este paciente');return;}
  sync('saving');
  const{data,error}=await sb.from('pacientes').insert({nombre,prevision,alta:false,modalidad}).select().single();
  if(error){sync('error');alert('Error al guardar');return;}
  pts[data.id]={id:data.id,nombre,prevision,alta:false,modalidad,nextSession:null,inactiveWeeks:null,ses:[]};
  sync('ok');closeModal();renderNav();showPatient(data.id);
}

function sesForm(id,ses=null){
  const p=pts[id];
  const today=new Date();
  const dd=String(today.getDate()).padStart(2,'0'),mm=String(today.getMonth()+1).padStart(2,'0');
  const dFecha=ses?.fecha||`${dd}/${mm}/${today.getFullYear()}`;
  const dMes=ses?.mes||MESES[today.getMonth()];
  const dPrev=ses?.prevision||p?.ses[p.ses.length-1]?.prevision||p?.prevision||'Fonasa';
  const dMonto=ses?.monto??getTarifa(dPrev);
  const dEst=ses?.estado||'';const dObs=ses?.observaciones||'';
  const action=ses?`saveSesEdit('${esc(id)}','${esc(ses.id)}')`:`saveSesNew('${esc(id)}')`;
  document.getElementById('modal-root').innerHTML=`<div class="overlay"><div class="modal">
    <h3>${ses?'Editar':'Nueva'} sesión — ${p?.nombre||''}</h3>
    <div class="fr">
      <div class="fg"><label class="fl">Fecha (DD/MM/AAAA)</label><input class="fi2" id="s-f" type="text" value="${dFecha}"></div>
      <div class="fg"><label class="fl">Mes</label><select class="fs" id="s-m">${MESES.map(m=>`<option value="${m}" ${m===dMes?'selected':''}>${m[0].toUpperCase()+m.slice(1)}</option>`).join('')}</select></div>
    </div>
    <div class="fr">
      <div class="fg"><label class="fl">Previsión</label><select class="fs" id="s-p" onchange="autoM()">${PREV_LIST.map(pr=>`<option ${pr===dPrev?'selected':''}>${pr}</option>`).join('')}</select></div>
      <div class="fg"><label class="fl">Monto ($)</label><input class="fi2" id="s-mo" type="number" value="${dMonto}"></div>
    </div>
    <div class="fg"><label class="fl">Estado de pago</label><select class="fs" id="s-e">${ESTADOS.map(e=>`<option value="${e}" ${e===dEst?'selected':''}>${e||'Sin estado'}</option>`).join('')}</select></div>
    <div class="fg"><label class="fl">Observaciones</label><input class="fi2" id="s-o" type="text" value="${dObs}" placeholder="Notas opcionales\u2026"></div>
    <div class="mf"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="${action}">Guardar</button></div>
  </div></div>`;
}
function showAddSes(id){sesForm(id);}
function showEditSes(id,sid){const s=pts[id]?.ses.find(x=>x.id===sid);if(s)sesForm(id,s);}
function autoM(){const p=document.getElementById('s-p')?.value;if(p)document.getElementById('s-mo').value=getTarifa(p);}
function getSesData(){return{fecha:document.getElementById('s-f').value.trim(),mes:document.getElementById('s-m').value,prevision:document.getElementById('s-p').value,monto:parseInt(document.getElementById('s-mo').value)||0,estado:document.getElementById('s-e').value,observaciones:document.getElementById('s-o').value.trim()};}

async function saveSesNew(id){
  const data={paciente_id:id,...getSesData()};sync('saving');
  const{data:saved,error}=await sb.from('sesiones').insert(data).select().single();
  if(error){sync('error');alert('Error al guardar');return;}
  pts[id].ses.push(saved);sync('ok');closeModal();renderPatient(id);
}
async function saveSesEdit(id,sid){
  const data=getSesData();sync('saving');
  const{error}=await sb.from('sesiones').update(data).eq('id',sid);
  if(error){sync('error');alert('Error al guardar');return;}
  const i=pts[id].ses.findIndex(s=>s.id===sid);
  if(i>=0)pts[id].ses[i]={...pts[id].ses[i],...data};
  sync('ok');closeModal();renderPatient(id);
}
async function delSes(id,sid){
  if(!confirm('¿Eliminar esta sesión?'))return;sync('saving');
  const{error}=await sb.from('sesiones').delete().eq('id',sid);
  if(error){sync('error');return;}
  pts[id].ses=pts[id].ses.filter(s=>s.id!==sid);sync('ok');renderPatient(id);
}
async function delPatient(id){
  const p=pts[id];
  if(!confirm(`¿Eliminar a ${p?.nombre} y todas sus sesiones?\nNo se puede deshacer.`))return;sync('saving');
  const{error}=await sb.from('pacientes').delete().eq('id',id);
  if(error){sync('error');return;}
  delete pts[id];sync('ok');showView('dashboard');
}
function showObs(obs,fecha){
  const text=obs&&obs.trim()?obs:null;
  document.getElementById('modal-root').innerHTML=`<div class="obs-popup" onclick="if(event.target===this)closeModal()"><div class="obs-box">
    <h4>💬 Observación — ${fecha}</h4>
    ${text?`<p>${text.replace(/</g,'&lt;').replace(/>/g,'&gt;')}</p>`:'<p style="color:var(--text3);font-style:italic">Sin observaciones registradas.</p>'}
    <button class="obs-close" onclick="closeModal()">Cerrar</button>
  </div></div>`;
}
function closeModal(){document.getElementById('modal-root').innerHTML='';}

// ── PDF ───────────────────────────────────────────────
async function showPdfDialog(){
  const years=[...new Set(allSessions().map(s=>s.fecha?s.fecha.split('/')[2]:String(CUR_YEAR)))].filter(Boolean).sort();
  document.getElementById('modal-root').innerHTML=`<div class="overlay"><div class="modal">
    <h3>Exportar a PDF</h3>
    <div class="fg"><label class="fl">Año a exportar</label><select class="fs" id="pdf-year">${years.map(y=>`<option value="${y}" ${y===String(CUR_YEAR)?'selected':''}>${y}</option>`).join('')}</select></div>
    <div style="background:var(--surface2);border-radius:var(--r-sm);padding:12px 14px;font-size:12px;color:var(--text2)">Incluye portada, totales por mes, gráfico y una página por paciente.</div>
    <div class="mf"><button class="btn" onclick="closeModal()">Cancelar</button><button class="btn btn-primary" onclick="generatePdf()">Generar PDF</button></div>
  </div></div>`;
}
async function generatePdf(){
  const year=document.getElementById('pdf-year')?.value||String(CUR_YEAR);
  closeModal();sync('saving','Generando PDF\u2026');
  const all=allSessions();
  const yearSessions=all.filter(s=>s.fecha&&s.fecha.split('/')[2]===year);
  const patientsWithSessions=Object.values(pts).filter(p=>p.ses.some(s=>s.fecha&&s.fecha.split('/')[2]===year)).sort((a,b)=>a.nombre.localeCompare(b.nombre));
  const total=yearSessions.reduce((a,s)=>a+s.monto,0);
  const cobrado=yearSessions.filter(s=>s.estado==='Cobrado').reduce((a,s)=>a+s.monto,0);
  const pagado=yearSessions.filter(s=>s.estado==='Pagado').reduce((a,s)=>a+s.monto,0);
  const pendiente=yearSessions.filter(s=>s.estado==='Pendiente').reduce((a,s)=>a+s.monto,0);
  const monMap={};
  yearSessions.forEach(s=>{
    const mesIdx=MESES.indexOf(s.mes);if(mesIdx<0)return;
    const key=String(mesIdx+1).padStart(2,'0');
    if(!monMap[key])monMap[key]={mes:s.mes,ses:[],total:0,cob:0,pag:0,pen:0};
    monMap[key].ses.push(s);monMap[key].total+=s.monto;
    if(s.estado==='Cobrado')monMap[key].cob+=s.monto;
    else if(s.estado==='Pagado')monMap[key].pag+=s.monto;
    else if(s.estado==='Pendiente')monMap[key].pen+=s.monto;
  });
  const sortedMon=Object.keys(monMap).sort().map(k=>({...monMap[k]}));
  const maxV=Math.max(...sortedMon.map(m=>m.total),1);
  const barW=sortedMon.length>0?Math.floor(460/sortedMon.length)-4:40;
  const bars=sortedMon.map((m,i)=>{const h=Math.max(Math.round((m.total/maxV)*80),2);const x=i*(barW+4)+10;return`<rect x="${x}" y="${90-h}" width="${barW}" height="${h}" fill="#1b3f6e" rx="2"/><text x="${x+barW/2}" y="105" text-anchor="middle" font-size="8" fill="#666">${m.mes.slice(0,3)}</text><text x="${x+barW/2}" y="${84-h}" text-anchor="middle" font-size="7" fill="#1b3f6e">$${Math.round(m.total/1000)}k</text>`;}).join('');
  const mesRows=sortedMon.map(m=>`<tr><td>${m.mes[0].toUpperCase()+m.mes.slice(1)}</td><td style="text-align:center">${m.ses.length}</td><td style="text-align:right">$${fmt(m.total)}</td><td style="text-align:right;color:#1a7a5a">$${fmt(m.cob)}</td><td style="text-align:right;color:#1a5fa8">$${fmt(m.pag)}</td><td style="text-align:right;color:#b83232">$${fmt(m.pen)}</td></tr>`).join('');
  const prevT={};yearSessions.forEach(s=>{prevT[s.prevision]=(prevT[s.prevision]||{total:0,n:0});prevT[s.prevision].total+=s.monto;prevT[s.prevision].n++;});
  const prevRows=Object.entries(prevT).sort((a,b)=>b[1].total-a[1].total).map(([p,v])=>`<tr><td>${p}</td><td style="text-align:center">${v.n}</td><td style="text-align:right">$${fmt(v.total)}</td></tr>`).join('');
  const patientPages=patientsWithSessions.map(p=>{
    const pSes=p.ses.filter(s=>s.fecha&&s.fecha.split('/')[2]===year);
    const pTotal=pSes.reduce((a,s)=>a+s.monto,0);
    const pCob=pSes.filter(s=>s.estado==='Cobrado').reduce((a,s)=>a+s.monto,0);
    const pPag=pSes.filter(s=>s.estado==='Pagado').reduce((a,s)=>a+s.monto,0);
    const pPen=pSes.filter(s=>s.estado==='Pendiente').reduce((a,s)=>a+s.monto,0);
    const sesRows=pSes.map((s,i)=>`<tr style="background:${i%2===0?'#fff':'#f7f9fc'}"><td style="text-align:center">${i+1}</td><td>${s.fecha}</td><td>${s.mes?s.mes[0].toUpperCase()+s.mes.slice(1):'—'}</td><td>${s.prevision||'—'}</td><td style="text-align:right">$${fmt(s.monto)}</td><td style="text-align:center">${s.estado||'Sin estado'}</td><td style="color:#666;font-size:11px">${s.observaciones||'—'}</td></tr>`).join('');
    return`<div style="page-break-before:always;padding:32px 40px;font-family:Arial,sans-serif">
      <div style="border-bottom:2px solid #1b3f6e;padding-bottom:12px;margin-bottom:20px;display:flex;justify-content:space-between;align-items:flex-end">
        <div><div style="font-size:10px;color:#8c96b0;text-transform:uppercase;margin-bottom:4px">Paciente</div>
          <div style="font-size:20px;font-weight:700;color:#1a2035">${p.nombre}${p.alta?'<span style="font-size:12px;color:#b86000;margin-left:8px">(Alta)</span>':''}</div>
          <div style="font-size:12px;color:#4a5578;margin-top:4px">${p.prevision||'—'} · ${p.modalidad||'Presencial'} · Año ${year}</div>
        </div>
        <div style="text-align:right"><div style="font-size:22px;font-weight:700;color:#1b3f6e">$${fmt(pTotal)}</div><div style="font-size:11px;color:#8c96b0">${pSes.length} sesiones</div></div>
      </div>
      <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:20px">
        <div style="background:#f5f7fa;border-radius:8px;padding:12px;text-align:center"><div style="font-size:10px;color:#8c96b0;text-transform:uppercase;margin-bottom:4px">Total</div><div style="font-size:16px;font-weight:700">$${fmt(pTotal)}</div></div>
        <div style="background:#e6f5ef;border-radius:8px;padding:12px;text-align:center"><div style="font-size:10px;color:#1a7a5a;text-transform:uppercase;margin-bottom:4px">Cobrado</div><div style="font-size:16px;font-weight:700;color:#1a7a5a">$${fmt(pCob)}</div></div>
        <div style="background:#e8f0fb;border-radius:8px;padding:12px;text-align:center"><div style="font-size:10px;color:#1a5fa8;text-transform:uppercase;margin-bottom:4px">Pagado</div><div style="font-size:16px;font-weight:700;color:#1a5fa8">$${fmt(pPag)}</div></div>
        <div style="background:#fdeaea;border-radius:8px;padding:12px;text-align:center"><div style="font-size:10px;color:#b83232;text-transform:uppercase;margin-bottom:4px">Pendiente</div><div style="font-size:16px;font-weight:700;color:#b83232">$${fmt(pPen)}</div></div>
      </div>
      <table style="width:100%;border-collapse:collapse;font-size:12px">
        <thead><tr style="background:#1b3f6e;color:#fff"><th style="padding:8px;text-align:center">#</th><th style="padding:8px;text-align:left">Fecha</th><th style="padding:8px">Mes</th><th style="padding:8px">Previsión</th><th style="padding:8px;text-align:right">Monto</th><th style="padding:8px;text-align:center">Estado</th><th style="padding:8px">Observaciones</th></tr></thead>
        <tbody>${sesRows}</tbody>
        <tfoot><tr style="background:#f0f3f8;font-weight:700;border-top:2px solid #1b3f6e"><td colspan="4" style="padding:8px">Total ${year}</td><td style="padding:8px;text-align:right">$${fmt(pTotal)}</td><td colspan="2"></td></tr></tfoot>
      </table>
    </div>`;
  }).join('');
  const html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Consulta Privada ${year}</title><style>*{box-sizing:border-box;margin:0;padding:0}body{font-family:Arial,sans-serif;color:#1a2035;font-size:13px;-webkit-print-color-adjust:exact;print-color-adjust:exact}@page{margin:0;size:A4}table{border-collapse:collapse;width:100%}th,td{padding:7px 10px;border-bottom:1px solid #e0e6ef}thead tr th{background:#1b3f6e;color:#fff;font-size:11px;text-transform:uppercase;letter-spacing:0.05em}</style></head><body>
  <div style="padding:40px;font-family:Arial,sans-serif">
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:32px;padding-bottom:20px;border-bottom:3px solid #1b3f6e">
      <div style="width:52px;height:52px;background:#1b3f6e;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:30px;color:#fff;font-family:serif;font-weight:700">\u03C8</div>
      <div><div style="font-size:24px;font-weight:700;color:#1b3f6e">Consulta Privada — ${year}</div><div style="font-size:13px;color:#8c96b0;margin-top:2px">Generado el ${new Date().toLocaleDateString('es-CL',{day:'2-digit',month:'long',year:'numeric'})}</div></div>
    </div>
    <div style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:32px">
      <div style="background:#1b3f6e;border-radius:10px;padding:16px;color:#fff"><div style="font-size:10px;opacity:.6;text-transform:uppercase;margin-bottom:6px">Total facturado</div><div style="font-size:22px;font-weight:700">$${fmt(total)}</div><div style="font-size:11px;opacity:.5;margin-top:4px">${yearSessions.length} ses. · ${patientsWithSessions.length} pacientes</div></div>
      <div style="background:#e6f5ef;border-radius:10px;padding:16px"><div style="font-size:10px;color:#1a7a5a;text-transform:uppercase;margin-bottom:6px">Cobrado</div><div style="font-size:22px;font-weight:700;color:#1a7a5a">$${fmt(cobrado)}</div></div>
      <div style="background:#e8f0fb;border-radius:10px;padding:16px"><div style="font-size:10px;color:#1a5fa8;text-transform:uppercase;margin-bottom:6px">Pagado</div><div style="font-size:22px;font-weight:700;color:#1a5fa8">$${fmt(pagado)}</div></div>
      <div style="background:#fdeaea;border-radius:10px;padding:16px"><div style="font-size:10px;color:#b83232;text-transform:uppercase;margin-bottom:6px">Pendiente</div><div style="font-size:22px;font-weight:700;color:#b83232">$${fmt(pendiente)}</div></div>
    </div>
    <div style="margin-bottom:28px"><div style="font-size:11px;font-weight:600;color:#8c96b0;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">Ingresos por mes</div><svg width="480" height="115" xmlns="http://www.w3.org/2000/svg">${bars}</svg></div>
    <div style="margin-bottom:28px"><div style="font-size:11px;font-weight:600;color:#8c96b0;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">Por mes</div>
      <table><thead><tr><th>Mes</th><th style="text-align:center">Ses.</th><th style="text-align:right">Total</th><th style="text-align:right">Cobrado</th><th style="text-align:right">Pagado</th><th style="text-align:right">Pendiente</th></tr></thead>
      <tbody>${mesRows}<tr style="background:#f0f3f8;font-weight:700;border-top:2px solid #1b3f6e"><td>Total ${year}</td><td style="text-align:center">${yearSessions.length}</td><td style="text-align:right">$${fmt(total)}</td><td style="text-align:right;color:#1a7a5a">$${fmt(cobrado)}</td><td style="text-align:right;color:#1a5fa8">$${fmt(pagado)}</td><td style="text-align:right;color:#b83232">$${fmt(pendiente)}</td></tr></tbody></table>
    </div>
    <div><div style="font-size:11px;font-weight:600;color:#8c96b0;text-transform:uppercase;letter-spacing:.06em;margin-bottom:10px">Por previsión</div>
      <table><thead><tr><th>Previsión</th><th style="text-align:center">Sesiones</th><th style="text-align:right">Total</th></tr></thead><tbody>${prevRows}</tbody></table>
    </div>
  </div>
  ${patientPages}
  </body></html>`;
  const win=window.open('','_blank');
  win.document.write(html);win.document.close();
  win.onload=()=>setTimeout(()=>win.print(),500);
  sync('ok');
}

// ── BACKUP ────────────────────────────────────────────
async function downloadBackup(){
  sync('saving','Exportando\u2026');
  try{
    const{data:pats}=await sb.from('pacientes').select('*').order('nombre');
    const{data:sess}=await sb.from('sesiones').select('*').order('created_at');
    const blob=new Blob([JSON.stringify({fecha:new Date().toISOString(),pacientes:pats,sesiones:sess},null,2)],{type:'application/json'});
    const url=URL.createObjectURL(blob);const a=document.createElement('a');
    a.href=url;a.download=`consulta_respaldo_${new Date().toISOString().slice(0,10)}.json`;
    a.click();URL.revokeObjectURL(url);sync('ok');
  }catch(e){sync('error');}
}


function waUrl(telefono, texto){
  const msg = encodeURIComponent(texto);
  const base = telefono ? `https://wa.me/${telefono.replace(/\D/g,'')}` : 'https://wa.me';
  window.open(`${base}?text=${msg}`, '_blank');
}

function waAgendar(id){
  const p=pts[id]; if(!p) return;
  const fecha = p.nextSession || '[fecha por definir]';
  const nombre = p.nombre.split(' ')[0];
  const msg = `Hola ${nombre}, espero te encuentres bien. Te escribo para agendar tu próxima sesión. Me gustaría que nos viésemos el ${fecha}. Quedo atento a tu disponibilidad, un abrazo.`;
  waUrl(p.telefono||'', msg);
}

function waCobro(id){
  const p=pts[id]; if(!p) return;
  const n = p.ses.filter(s=>s.estado==='Pendiente').length;
  const nombre = p.nombre.split(' ')[0];
  const msg = `Hola ${nombre}, espero te encuentres bien. Te escribo para comentarte que de momento hay ${n} sesión${n===1?'':'es'} pendiente${n===1?'':'s'} de pago. Quedo a la espera, un gran abrazo.`;
  waUrl(p.telefono||'', msg);
}

function waConfirmar(id){
  const p=pts[id]; if(!p) return;
  const fecha = p.nextSession || '[fecha de la sesión]';
  const nombre = p.nombre.split(' ')[0];
  const msg = `Hola ${nombre}, espero te encuentres bien. Te escribo para recordarte de nuestra sesión del ${fecha}. ¿Puedes confirmar tu asistencia? Responde SI para confirmar. Un abrazo.`;
  waUrl(p.telefono||'', msg);
}

async function setConfirmacion(id, val){
  pts[id].confirmacion = val;
  sync('saving');
  await sb.from('pacientes').update({confirmacion: val}).eq('id', id);
  sync('ok');
  renderPatient(id);
}

async function clearConfirmacion(id){
  pts[id].confirmacion = null;
  sync('saving');
  await sb.from('pacientes').update({confirmacion: null}).eq('id', id);
  sync('ok');
  renderPatient(id);
}

function updateBN(v){
  document.querySelectorAll('.bn-item').forEach(e=>e.classList.remove('active'));
  const el=document.getElementById('bn-'+v);
  if(el)el.classList.add('active');
}
checkSession();
</script>
</body>
</html>
